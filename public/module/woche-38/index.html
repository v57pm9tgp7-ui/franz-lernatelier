<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b315f">
<title>Franz Lernatelier – Woche 38</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",Aptos,Arial,sans-serif;background:#f4f2ec;color:#10233f}
.loading{width:min(620px,calc(100% - 36px));background:#fff;border:1px solid #d7dfdc;border-radius:22px;padding:28px;box-shadow:0 18px 46px rgba(14,43,66,.12)}
.loading b{display:block;color:#0b315f;font-size:28px}.loading p{margin:8px 0 0;color:#526477;font-size:18px;line-height:1.5}
.loading i{display:block;width:48px;height:5px;margin-top:20px;border-radius:999px;background:linear-gradient(90deg,#0055a4 0 33%,#fff 33% 66%,#ef4135 66%);border:1px solid #d7dfdc}
</style>
</head>
<body>
<div class="loading" id="w38Loader"><b>Woche 38 wird vorbereitet …</b><p>Ihr Arbeitsstand aus Woche 37 wird übernommen. Nach der Videoabgabe steht zusätzlich das neue Kapitel «Mes vacances d’automne» bereit.</p><i></i></div>
<script>
(async () => {
  const loader = document.getElementById('w38Loader');
  try {
    const response = await fetch('../woche-37/index.html', {cache:'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    let html = await response.text();

    // Woche 38 führt die bekannten Aufgaben aus Woche 37 weiter.
    // Danach ergänzt week38-module.js ein eigenständiges Zusatzkapitel.
    html = html
      .replace('Franz Lernatelier Woche 37:', 'Franz Lernatelier Woche 38:')
      .replace('Franz Lernatelier – Woche 37 · Qui suis-je ?', 'Franz Lernatelier – Woche 38 · Qui suis-je ?')
      .replace('.passport::after{content:"37"', '.passport::after{content:"38"')
      .replace('Woche 37 · Qui suis-je ?', 'Woche 38 · Qui suis-je ?')
      .replace('Passeport de français · A2 · Woche 37', 'Woche 38 · Weiterarbeiten')
      .replaceAll('Wortschatz · Woche 37', 'Wortschatz · Woche 38')
      .replaceAll('Franz-Lernatelier-Woche-37-', 'Franz-Lernatelier-Woche-38-')
      .replaceAll('Franz-Woche-37.', 'Franz-Woche-38.')
      .replace(/(FranzNavigation\.create\(\{week:)37/g, '$138');

    html = html.replace(
      /(<script src="\.\.\/\.\.\/assets\/practice-studio\.js[^"]*"><\/script>)/,
      '$1<script src="../../assets/practice-vocab-config.js?v=20260913-teacher1"><\/script>'
    );
    html = html.replace('</body>', '<script src="../../assets/week38-module.js?v=20260913-w38-2"><\/script></body>');

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    loader.innerHTML = '<b>Woche 38 konnte nicht geladen werden.</b><p>Bitte laden Sie die Seite neu. Falls das Problem bleibt, öffnen Sie vorübergehend Woche 37 – Ihr Arbeitsstand geht nicht verloren.</p>';
  }
})();
</script>
</body>
</html>
