","q":"Eine Pflanze hat Genotyp Aa und zeigt violette Blüten. Was ist hier der Phänotyp?","opts":["Aa","Das A-Allel","Violette Blüten","Zwei Chromatiden"],"ans":2,"why":"Aa = Genotyp. Violette Blüten = beobachtbare Ausprägung.","level":1,"type":"choice"},{"ch":"grundlagen","q":"Welche Aussage zur Augenfarbe des Menschen ist fachlich am besten?","opts":["Nur ein Gen mit zwei Allelen bestimmt sie vollständig.","Sie ist ein gutes Beispiel für einen garantiert einfachen Mendel-Erbgang.","Sie wird von vielen Genen mitbestimmt und lässt sich nicht zuverlässig mit nur A und a erklären.","Sie hängt ausschliesslich von der Ernährung ab."],"ans":2,"why":"Augenfarbe ist ein polygenes Merkmal; die Erbsenbeispiele bleiben bewusst einfach.","level":2,"type":"choice"},{"ch":"grundlagen","q":"Wie heissen unterschiedliche Varianten desselben Gens?","answers":["allele","allel"],"why":"Allele sind Varianten eines Gens.","level":2,"type":"fill"},{"ch":"fortpflanzung","q":"Warum könnte sich eine asexuell vermehrende Pflanze in stabilem Umfeld schnell ausbreiten?","opts":["Sie muss erst eine passende Gamete finden.","Sie braucht meist keine Partnersuche und kann erfolgreiche Merkmale direkt weitergeben.","Sie hat automatisch eine grössere genetische Vielfalt.","Sie darf keine DNA besitzen."],"ans":1,"why":"Asexuelle Fortpflanzung spart häufig Zeit und Ressourcen.","level":2,"type":"choice"},{"ch":"fortpflanzung","q":"Welche Aussage zur sexuellen Fortpflanzung ist zu pauschal?","opts":["Gameten werden bei Menschen durch Meiose gebildet.","Rekombination kann Erbinformation neu kombinieren.","Es müssen bei jeder Art zwingend zwei verschiedene Geschlechter an einer Befruchtung beteiligt sein.","Befruchtung kombiniert DNA von Gameten."],"ans":2,"why":"Viele Arten sind zwittrig oder nutzen Selbstbefruchtung.","level":2,"type":"choice"},{"ch":"fortpflanzung","q":"Wann ist höhere genetische Vielfalt besonders nützlich?","opts":["Wenn Umweltbedingungen wechseln und verschiedene Varianten vorteilhaft sein könnten.","Weil genetische Vielfalt jeden einzelnen Organismus unsterblich macht.","Weil dann keine Mutationen mehr auftreten.","Weil keine Gameten benötigt werden."],"ans":0,"why":"Vielfalt erhöht unter Umständen die Chance, dass Individuen mit geeigneten Merkmalen vorhanden sind.","level":1,"type":"choice"},{"ch":"chromosomen","q":"Was ist ein Nukleosom?","opts":["Eine Zelle mit einem Chromosomensatz","Ein DNA-Abschnitt, der um einen Kern aus acht Histonen gewickelt ist","Ein homologes Chromosomenpaar","Ein Spindelfaden"],"ans":1,"why":"Die Histon-Oktamere dienen als DNA-Verpackung.","level":2,"type":"choice"},{"ch":"chromosomen","q":"Welche Aufgabe besitzen die Telomere?","opts":["Sie verbinden homologe Chromosomen.","Sie schützen die Endbereiche linearer Chromosomen.","Sie verdoppeln die DNA in der S-Phase.","Sie bestimmen die Zahl der Allele."],"ans":1,"why":"Telomere schützen Chromosomenenden vor fehlerhafter Behandlung als Bruch.","level":2,"type":"choice"},{"ch":"chromosomen","q":"Was ist die richtige Reihenfolge der Verpackung?","opts":["Chromatid → Zelle → DNA → Proteine","DNA → Nukleosomen → Chromatin → verdichtetes Chromosom","Nukleosom → DNA → Genotyp → Gamet","Centromer → Telomer → Cytokinese"],"ans":1,"why":"Die DNA liegt um Histone gewickelt vor; das Chromatin kann weiter kondensieren.","level":2,"type":"choice"},{"ch":"chromosomen","q":"Wo liegt ein Telomer bei einem linearen Chromosom?","opts":["An den Enden","Immer genau in der Mitte","Auf der Äquatorialebene","Im Zellplasma"],"ans":0,"why":"Telomere bilden die Endstrukturen linearer Chromosomen.","level":1,"type":"choice"},{"ch":"chromosomen","q":"Wozu braucht die Zelle den Centromerbereich während einer Teilung?","opts":["Zum Produzieren der Histone","Für die geordnete Anheftung und Trennung über den Spindelapparat","Zum Entfernen aller Gene","Zum Verschmelzen von Gameten"],"ans":1,"why":"Die Kinetochore am Centromerbereich sind Ansatzstellen des Spindelapparats.","level":2,"type":"choice"},{"ch":"chromosomen","q":"Wie heissen die Proteine, um die die DNA beim Nukleosom gewickelt ist?","answers":["histone","histon"],"why":"Histone helfen bei der DNA-Verpackung.","level":2,"type":"fill"},{"ch":"karyogramm","q":"Wodurch werden zwei Chromosomen als homologes Paar erkennbar?","opts":["Durch ähnliches Bandenmuster, entsprechende Grösse und Centromerposition","Dadurch, dass beide immer exakt dieselben Allele tragen","Dadurch, dass sie beide von der Mutter stammen","Dadurch, dass es zwei Schwesterchromatiden sind"],"ans":0,"why":"Homologe Paare haben gleiche Genorte und entsprechende Strukturmerkmale.","level":2,"type":"choice"},{"ch":"karyogramm","q":"Welche Kombination besitzt eine typische menschliche haploide Gamete?","opts":["23 Chromosomen","46 Chromosomenpaare","92 Schwesterchromatiden in G₁","22 Chromosomensätze"],"ans":0,"why":"Haploide Gameten haben beim Menschen n = 23.","level":1,"type":"choice"},{"ch":"karyogramm","q":"Ein Chromosomenpaar hat unterschiedliche Allele für ein Gen. Sind die Chromosomen trotzdem homolog?","opts":["Nein, Homologe müssen immer dieselben Allele haben.","Ja, wenn sie entsprechende Genorte und Struktur besitzen.","Nein, sie gehören zwingend zu zwei Arten.","Nur wenn die Zelle haploid ist."],"ans":1,"why":"Homologe Chromosomen können unterschiedliche Varianten eines Gens tragen.","level":2,"type":"choice"},{"ch":"zellzyklus","q":"In welcher Phase erfüllt die Zelle ihre normalen Aufgaben und wächst?","opts":["G₁","S ausschliesslich","Anaphase","Cytokinese"],"ans":0,"why":"G₁ ist eine wichtige Wachstums- und Stoffwechselphase.","level":1,"type":"choice"},{"ch":"zellzyklus","q":"Welche Aussage zur G₀-Phase stimmt?","opts":["Die DNA wird in ihr immer kopiert.","Sie ist ein Zustand ausserhalb des aktiv ablaufenden Teilungszyklus.","In ihr trennen sich Schwesterchromatiden.","Sie ist ein anderer Name für Meiose II."],"ans":1,"why":"Zellen können aus G₁ in G₀ wechseln und vorerst nicht weiterteilen.","level":2,"type":"choice"},{"ch":"zellzyklus","q":"Was wird in der G₂-Phase typischerweise überprüft?","opts":["Ob die DNA-Replikation hinreichend vollständig und korrekt ist.","Ob schon vier Gameten entstanden sind.","Ob homologe Chromosomen bereits getrennt sind.","Ob die Staubblätter entfernt wurden."],"ans":0,"why":"G₂ dient Vorbereitung und Kontrolle vor der Teilung.","level":2,"type":"choice"},{"ch":"zellzyklus","q":"Bei welcher Aussage liegt ein Fehler vor?","opts":["Interphase umfasst G₁, S und G₂.","Die S-Phase verdoppelt die DNA.","Nach der S-Phase verdoppelt sich automatisch die Chromosomenzahl von 46 auf 92.","Die Mitose ist Kernteilung."],"ans":2,"why":"Die Anzahl Chromatiden verdoppelt sich, aber 2-Chromatid-Chromosomen zählen als je ein Chromosom.","level":2,"type":"choice"},{"ch":"zellzyklus","q":"Bringe die Zellzyklusphasen mit der Cytokinese in die richtige Reihenfolge.","items":["G₁: Wachstum und Aufgaben","S: DNA-Verdopplung","G₂: Kontrolle und Vorbereitung","Mitose: Kernteilung","Cytokinese: Zellplasmateilung"],"why":"Erst Interphase (G₁, S, G₂), dann die Zellteilung.","level":2,"type":"order"},{"ch":"mitose","q":"Was wird während der Prophase in der Zelle sichtbar?","opts":["Verdichtete Chromosomen","Vollständig entspiralisiertes Chromatin als X","Vier Gameten","Die F₂-Generation"],"ans":0,"why":"Das Chromatin kondensiert vor der Teilung zu erkennbaren Chromosomen.","level":2,"type":"choice"},{"ch":"mitose","q":"Was passiert mit der Kernhülle zu Beginn der Mitose?","opts":["Sie wird aufgebaut und bleibt unverändert.","Sie wird im Verlauf von Prophase/Prometaphase abgebaut.","Sie bildet ein Nukleosom.","Sie wird zu einem Telomer."],"ans":1,"why":"Dadurch können Spindelstrukturen mit den Chromosomen interagieren.","level":2,"type":"choice"},{"ch":"mitose","q":"In welcher Phase sind die Chromosomen besonders kompakt und einzeln in der Zellmitte aufgereiht?","opts":["Prophase","Metaphase","Telophase","G₀"],"ans":1,"why":"Die Metaphase zeigt eine charakteristische Anordnung in der Äquatorialebene.","level":1,"type":"choice"},{"ch":"mitose","q":"Was bedeutet «Spindelapparat»?","opts":["Faserapparat, der die Chromosomen während der Teilung bewegt und verteilt","Schutzhülle des Zellkerns","Sammlung aller Gene in einem Chromosom","Histon-Oktamer"],"ans":0,"why":"Spindelfasern lagern sich an Kinetochoren an und bewegen die Chromosomen.","level":2,"type":"choice"},{"ch":"mitose","q":"Welcher Vorgang gehört zur Telophase?","opts":["Trennung homologer Chromosomen","Wiederaufbau der Kernhüllen und Lockerung der Chromosomen","DNA-Replikation","Kreuzung reinerbiger Eltern"],"ans":1,"why":"In Telophase entstehen die Tochterkerne.","level":2,"type":"choice"},{"ch":"mitose","q":"Was unterscheidet die Cytokinese bei Tieren und Pflanzen typisch?","opts":["Tierische Zellen schnüren sich ein; Pflanzen bilden häufig eine Zellplatte.","Nur Tiere teilen Zellplasma.","Pflanzen benötigen keine Mitose.","Alle Pflanzen bilden Gameten statt Tochterzellen."],"ans":0,"why":"Die feste Zellwand führt bei Pflanzen zu einer anderen Art der Zellplasmateilung.","level":2,"type":"choice"},{"ch":"mitose","q":"Warum ist «Ein-Chromatin-Chromosom» als Begriff unpassend?","opts":["Weil es korrekt «Ein-Chromatid-Chromosom» heisst.","Weil es keine Chromosomen gibt.","Weil Chromatin nur im Boden vorkommt.","Weil jedes Chromosom aus vier Chromatiden besteht."],"ans":0,"why":"Chromatid beschreibt die einzelne Einheit des Chromosoms.","level":1,"type":"choice"},{"ch":"meiose","q":"Was passiert in der Prophase I, aber normalerweise nicht bei der mitotischen Prophase?","opts":["Homologe Chromosomen paaren sich und Crossing-over ist möglich.","Chromatin wird sichtbar.","Es entstehen Spindelfasern.","Kernhüllen können abgebaut werden."],"ans":0,"why":"Synapsis und Crossing-over sind typisch für Prophase I.","level":2,"type":"choice"},{"ch":"meiose","q":"Was liegt bei der Metaphase I in der Äquatorialebene?","opts":["Einzelne Schwesterchromatiden ohne Chromosom","Paare homologer Chromosomen","Nur Nucleoli","Vier Zellkerne"],"ans":1,"why":"Die Paaranordnung unterscheidet Metaphase I von Mitose und Meiose II.","level":2,"type":"choice"},{"ch":"meiose","q":"Was gilt unmittelbar nach Anaphase I?","opts":["Schwesterchromatiden sind vollständig getrennt.","Homologe Chromosomen wurden getrennt, Schwesterchromatiden bleiben zunächst verbunden.","DNA wird ein zweites Mal verdoppelt.","Vier diploide Zellen sind entstanden."],"ans":1,"why":"Die Reduktion beruht auf der Trennung homologer Chromosomen.","level":2,"type":"choice"},{"ch":"meiose","q":"Wie sehen die Chromosomen unmittelbar nach Meiose I aus?","opts":["In jeder Zelle n 2-Chromatid-Chromosomen","In jeder Zelle 2n 1-Chromatid-Chromosomen","Keine DNA mehr","In jeder Zelle n Chromosomenpaare"],"ans":0,"why":"Nach der ersten Teilung sind die Zellen haploid, aber jedes Chromosom ist noch verdoppelt.","level":2,"type":"choice"},{"ch":"meiose","q":"Was ist typisch für Metaphase II?","opts":["Homologe Paare ordnen sich nebeneinander an.","Einzelne Chromosomen werden in den haploiden Zellen mittig angeordnet.","DNA wird erneut kopiert.","Mütterliche Gameten verschmelzen."],"ans":1,"why":"Die homologen Partner wurden bereits in Meiose I getrennt.","level":2,"type":"choice"},{"ch":"meiose","q":"Welcher Vorgang geschieht in Anaphase II?","opts":["Trennung der Schwesterchromatiden","Paarung homologer Chromosomen","DNA-Replikation","Fremdbestäubung"],"ans":0,"why":"Meiose II verläuft hinsichtlich der Schwesterchromatidentrennung ähnlich wie Mitose.","level":2,"type":"choice"},{"ch":"meiose","q":"Welche Aussage ist in vielen Schulabbildungen vereinfacht?","opts":["Die Kernhülle bildet sich in jeder Telophase I zwingend neu.","Meiose besteht aus zwei Kernteilungen.","Es gibt nach Meiose I keinen weiteren DNA-Replikationsschritt.","Die Chromosomenzahl pro Zelle wird in Meiose I halbiert."],"ans":0,"why":"Kernhüllen/Nucleoli bauen sich in der meiotischen Zwischenphase je nach Organismus unterschiedlich auf.","level":2,"type":"choice"},{"ch":"meiose","q":"In welcher meiotischen Phase trennen sich die homologen Chromosomen?","answers":["anaphase i","anaphase 1"],"why":"Homologe Chromosomen trennen sich in Anaphase I.","level":2,"type":"fill"},{"ch":"meiose","q":"In welcher meiotischen Phase trennen sich die Schwesterchromatiden?","answers":["anaphase ii","anaphase 2"],"why":"Schwesterchromatiden trennen sich in Anaphase II.","level":2,"type":"fill"},{"ch":"meiose","q":"Ordne die Kernteilungsphasen von Meiose I.","items":["Prophase I: Paarung, Crossing-over möglich","Metaphase I: Homologe Paare in der Mitte","Anaphase I: Trennung der Homologen","Telophase I: zwei haploide Kerne möglich"],"why":"Die erste Reifeteilung trennt homologe Chromosomen.","level":2,"type":"order"},{"ch":"meiose","q":"Ordne die Kernteilungsphasen von Meiose II.","items":["Prophase II: Spindel bildet sich","Metaphase II: Chromosomen einzeln mittig","Anaphase II: Schwesterchromatiden trennen sich","Telophase II: vier haploide Kerne"],"why":"Die zweite Reifeteilung trennt Schwesterchromatiden.","level":2,"type":"order"},{"ch":"variabilitaet","q":"Eine Abbildung zeigt AB auf einem Chromatid und ab auf dem Homologen. Nach Austausch entsteht Ab. Was erklärt das?","opts":["Intrachromosomale Rekombination","Interchromosomale Rekombination","Cytokinese","Reinerbigkeit"],"ans":0,"why":"Ein Crossing-over tauscht entsprechende DNA-Abschnitte und verändert Allelkombinationen innerhalb eines Chromosoms.","level":2,"type":"choice"},{"ch":"variabilitaet","q":"In welcher Phase wird die zufällige Ausrichtung homologer Paare festgelegt?","opts":["Metaphase I","Telophase II","G₀","Anaphase der Mitose"],"ans":0,"why":"In Metaphase I sind die homologen Paare zufällig bezüglich ihrer Orientierung angeordnet.","level":2,"type":"choice"},{"ch":"variabilitaet","q":"Ein homologes Paar hat zwei unterschiedliche Allele. Wird bei der interchromosomalen Rekombination nur die DNA-Stelle dieses einen Gens getauscht?","opts":["Ja, immer ein einziges Gen.","Nein, dabei werden ganze homologe Chromosomen unabhängig verteilt.","Ja, immer zwischen Schwesterchromatiden.","Nein, aber nur ganze Zellkerne."],"ans":1,"why":"Der Austausch von Abschnitten ist das Crossing-over, nicht die interchromosomale Verteilung.","level":2,"type":"choice"},{"ch":"variabilitaet","q":"Weshalb sagt man bei Crossing-over «Nicht-Schwesterchromatiden»?","opts":["Weil Stücke zwischen den mütterlichen und väterlichen Homologen ausgetauscht werden.","Weil die beiden Chromatiden desselben replizierten Chromosoms identisch bleiben müssen.","Weil nur haploide Zellen existieren.","Weil Crossing-over vor der DNA-Replikation abläuft."],"ans":0,"why":"Die zwei beteiligten Chromatiden stammen aus unterschiedlichen homologen Chromosomen.","level":2,"type":"choice"},{"ch":"variabilitaet","q":"Wie nennt man die Rekombination durch die zufällige Verteilung ganzer Chromosomen?","answers":["interchromosomal","interchromosomale rekombination"],"why":"Interchromosomal bezieht sich auf ganze Chromosomen.","level":2,"type":"fill"},{"ch":"mendelversuche","q":"Weshalb wählte Mendel reinerbige Ausgangslinien?","opts":["Damit die Vererbung des betrachteten Merkmals vorhersagbar startet.","Damit sich keine DNA im Erbgut befindet.","Damit jede Pflanze nur eine Chromatide besitzt.","Damit er die Meiose ausschalten konnte."],"ans":0,"why":"Reinerbigkeit sichert, dass die Ausgangslinien für das gewählte Merkmal gleichbleibend sind.","level":2,"type":"choice"},{"ch":"mendelversuche","q":"Warum entfernte Mendel bei den Empfängerblüten die Staubblätter?","opts":["Um unerwünschte Selbstbestäubung zu verhindern.","Damit kein Fruchtknoten entstehen kann.","Damit Chromosomen halbiert werden.","Um Crossing-over auszulösen."],"ans":0,"why":"Staubblätter produzieren Pollen; das Entfernen verhindert eine unerwünschte Selbstbefruchtung.","level":2,"type":"choice"},{"ch":"mendelversuche","q":"Welche Funktion hatte das gezielte Übertragen von Pollen auf die Narbe?","opts":["Es sollte eine kontrollierte Fremdbestäubung ermöglichen.","Es diente der Verdopplung von Chromosomen.","Es sollte die F₂-Pflanzen in Klone verwandeln.","Es ersetzte die Kernteilung."],"ans":0,"why":"Der Pollen stammt von einer ausgewählten Elternlinie.","level":2,"type":"choice"},{"ch":"mendelversuche","q":"Weshalb wurden die gekreuzten Blüten umhüllt?","opts":["Damit unerwünschter Pollen von anderen Pflanzen fernblieb.","Damit sie keine Samen entwickeln.","Damit die Erbsen ohne Licht mutieren.","Damit aus F₁ sofort F₂ wird."],"ans":0,"why":"Schutz vor nicht kontrollierter Fremdbestäubung.","level":2,"type":"choice"},{"ch":"mendelversuche","q":"Warum zog Mendel Nachkommen bis in die F₂-Generation?","opts":["Um zu sehen, ob die Merkmale über Generationen wieder auftreten und sich aufspalten.","Weil F₁ immer unfruchtbar ist.","Weil sich jede Pflanze mindestens zweimal vegetativ vermehren muss.","Weil reinerbige Pflanzen keine Gameten bilden."],"ans":0,"why":"Erst beim Weiterkreuzen der F₁ wird das Spaltungsverhältnis sichtbar.","level":2,"type":"choice"},{"ch":"mendelversuche","q":"Ordne Mendels experimentelles Vorgehen.","items":["Reinerbige Pflanzenlinien auswählen","Staubblätter der Empfängerblüten entfernen","Ausgewählten Pollen auf eine Narbe übertragen","Blüten vor fremdem Pollen schützen","Samen ziehen, F₁ untersuchen und weiterkreuzen"],"why":"Nur kontrollierte Kreuzungen erlauben die Untersuchung der Vererbung.","level":2,"type":"order"},{"ch":"mendelregeln","q":"Rot RR × weiss WW – welche F₁ entsteht bei intermediärer Vererbung?","opts":["Alle RR und rot","Alle WW und weiss","Alle RW und rosa","3 rot : 1 weiss"],"ans":2,"why":"Alle F₁ sind RW und zeigen eine Zwischenform – die 1. Regel gilt auch hier.","level":2,"type":"choice"},{"ch":"mendelregeln","q":"Bei RW × RW im intermediären Modell: Welches Phänotypverhältnis gilt für F₂?","opts":["3 rot : 1 weiss","1 rot : 2 rosa : 1 weiss","Alle rosa","1 rot : 1 weiss"],"ans":1,"why":"RR = rot, RW = rosa, WW = weiss.","level":2,"type":"choice"},{"ch":"mendelregeln","q":"Welche Aussage zur zweiten Mendel-Regel ist korrekt?","opts":["Bei intermediärer Vererbung ist das Phänotypverhältnis immer 3:1.","Bei vollständiger Dominanz ist das F₂-Phänotypverhältnis bei Aa × Aa 3:1.","Das Genotypverhältnis ist bei Aa × Aa immer 3:1.","Die F₂ enthält bei Aa × Aa nur zwei verschiedene Genotypen."],"ans":1,"why":"Die Dominanzform entscheidet über das Phänotypverhältnis, nicht das 1:2:1-Genotypverhältnis.","level":2,"type":"choice"},{"ch":"mendelregeln","q":"Was bedeutet «uniform» in Mendels erstem Versuch?","opts":["Alle F₁-Nachkommen sind beim untersuchten Merkmal gleich.","Alle F₂-Nachkommen sind homozygot.","Alle Eltern müssen denselben Phänotyp haben.","Alle Zellen sind haploid."],"ans":0,"why":"Reinerbige Eltern unterschiedlicher Ausprägungen erzeugen eine einheitliche F₁.","level":2,"type":"choice"},{"ch":"mendelregeln","q":"RW × RW, intermediär: Wie gross ist die Wahrscheinlichkeit für rosa?","opts":["0 %","25 %","50 %","75 %"],"ans":2,"why":"2 von 4 möglichen Genotypkombinationen lauten RW.","level":2,"type":"choice"},{"ch":"mendelregeln","q":"Bei gelb (AA) × grün (aa) sind alle F₁ gelb. Welche Erklärung stimmt?","opts":["Alle F₁ sind AA, weil Gelb dominant ist.","Alle F₁ sind Aa; das dominante Allel bestimmt den Phänotyp.","Das grüne Allel verschwindet.","Alle F₁ sind aa."],"ans":1,"why":"Das rezessive a bleibt in F₁ vorhanden, ist aber phänotypisch überdeckt.","level":2,"type":"choice"},{"ch":"mendelregeln","q":"Kreuzung Aa × Aa: Welcher Anteil der F₂ ist reinerbig?","opts":["0 %","25 %","50 %","75 %"],"ans":2,"why":"AA und aa sind beide homozygot, zusammen zwei von vier möglichen Nachkommen.","level":2,"type":"choice"},{"ch":"mendelregeln","q":"Wie lautet das erwartete F₂-Phänotypverhältnis bei einem intermediären Erbgang (RR × WW, dann RW × RW)?","answers":["1:2:1","1 : 2 : 1"],"why":"RR:RW:WW sehen verschieden aus, also Rot:Rosa:Weiss = 1:2:1.","level":2,"type":"fill"}],"transfers":[["grundlagen","Erkläre den Unterschied zwischen Gen, Allel, Genotyp und Phänotyp mit einem selbst gewählten Beispiel.","Ein Gen ist ein DNA-Abschnitt, ein Allel eine Variante des Gens. Der Genotyp ist beispielsweise Aa, der Phänotyp die violette Blütenfarbe.","Vier Fachbegriffe korrekt; ein stimmiges Beispiel"],["grundlagen","Ein Kind hat nicht genau dieselben Merkmale wie seine Geschwister. Erkläre dies ohne den Begriff «Zufall» allein als Begründung zu verwenden.","Bei Meiose werden Chromosomen zufällig verteilt und durch Crossing-over neu kombiniert. Ausserdem treffen bei der Befruchtung zufällige Gameten zusammen.","Mindestens zwei genetische Mechanismen und deren Wirkung"],["fortpflanzung","Vergleiche die Fortpflanzung von Erdbeeren durch Ausläufer mit der sexuellen Fortpflanzung bei Blütenpflanzen.","Ausläufer: ohne Gametenverschmelzung, meist genetisch gleiche Tochterpflanzen, schneller. Sexuell: Verschmelzung von Gameten, neue Genkombinationen, dafür aufwendiger.","Fortpflanzungsweg, Vielfalt, Vor- und Nachteil"],["fortpflanzung","Eine plötzlich auftretende Krankheit befällt viele identische Pflanzenklone. Begründe, weshalb eine genetisch vielfältige Population Vorteile haben könnte.","Wenn alle Klone genetisch gleich sind, können alle gleich anfällig sein. In einer vielfältigen Population könnten einige Individuen resistente Merkmalskombinationen besitzen.","Variation und unterschiedliche Anfälligkeit erklären"],["chromosomen","Eine Körperzelle besitzt vor der S-Phase 46 Chromosomen. Wie viele Chromosomen und Chromatiden hat sie unmittelbar nach der S-Phase? Begründe.","46 Chromosomen und 92 Chromatiden. Jedes der 46 Chromosomen wurde DNA-seitig verdoppelt, zählt aber bis zur Trennung als eines.","Beide Zahlen und nachvollziehbare Begründung"],["chromosomen","Unterscheiden Sie homologe Chromosomen und Schwesterchromatiden mit einem Beispiel.","Homologe sind ein mütterliches und ein väterliches Chromosom desselben Paars, z. B. zwei Chromosomen 7. Schwesterchromatiden sind Kopien desselben Chromosoms nach der S-Phase.","Herkunft, gleicher Genort, Kopierbezug"],["karyogramm","Ein Karyogramm hat die Bezeichnung 47,XY,+21. Erkläre alle drei Bestandteile und was man nicht daraus ablesen kann.","47 Chromosomen; XY-Konstellation; zusätzliches Chromosom 21 (Trisomie 21). Keine Aussagen über einzelne Basenmutationen, Persönlichkeit oder vollständige Merkmalsausprägungen.","47, XY und +21 korrekt; eine Grenze des Karyogramms"],["karyogramm","Beschreibe drei Kriterien, nach denen Chromosomen im Karyogramm sortiert werden.","Grösse, Bandenmuster und Lage des Centromers.","Alle drei Kriterien"],["zellzyklus","Beschreibe den Zellzyklus ab G₁ bis zum Abschluss der Zellteilung.","G₁ Wachstum; S DNA-Replikation; G₂ Kontrolle und Vorbereitung; Mitose Kernteilung; Cytokinese Teilung des Zellplasmas.","Reihenfolge und Bedeutung jedes Abschnitts"],["zellzyklus","Eine Mitschülerin sagt: «Nach der S-Phase hat die Zelle 92 Chromosomen.» Korrigieren Sie den Satz.","Die Zelle hat weiterhin 46 Chromosomen, aber 92 Chromatiden, weil jedes Chromosom aus zwei Schwesterchromatiden besteht.","46/92 und Unterschied Chromosom/Chromatid"],["mitose","Erläutere Prophase, Metaphase, Anaphase und Telophase der Mitose.","Prophase: Verdichtung/Spindel; Metaphase: Anordnung in Zellmitte; Anaphase: Trennung Schwesterchromatiden; Telophase: neue Kerne.","Alle vier in richtiger Reihenfolge und Vorgänge"],["mitose","Warum entstehen bei der Mitose im Normalfall zwei Zellen mit gleicher genetischer Information?","Die DNA wurde vorher repliziert und die Schwesterchromatiden werden geordnet zu zwei Polen verteilt, sodass jeder Tochterkern dieselbe Ausstattung bekommt.","Replikation, geordnete Trennung, Ergebnis"],["meiose","Stellen Sie Mitose und Meiose gegenüber: Zahl der Teilungen, Ergebnis und Trennung der Chromosomen.","Mitose: eine Kernteilung, zwei meist genetisch gleiche Zellen, Schwesterchromatiden getrennt. Meiose: zwei Teilungen, vier haploide unterschiedliche Produkte im Modell; I trennt homologe, II Schwesterchromatiden.","Drei Vergleichsmerkmale"],["meiose","Erkläre, warum Meiose I als Reduktionsteilung bezeichnet wird.","In Anaphase I werden homologe Chromosomen getrennt. Dadurch enthält jede Zelle danach einen statt zwei Chromosomensätzen (2n → n).","Anaphase I, homolog, 2n → n"],["variabilitaet","Erkläre Crossing-over möglichst genau: Zeitpunkt, Beteiligte, Ergebnis.","Prophase I, Nicht-Schwesterchromatiden homologer Chromosomen tauschen entsprechende DNA-Abschnitte aus. Es entstehen neue Allelkombinationen.","Prophase I, Beteiligte, Austausch, Variation"],["variabilitaet","Unterscheiden Sie Mutation und Rekombination. Warum ist beides für Variabilität wichtig?","Mutation verändert DNA-Sequenz und kann neue Allele erzeugen. Rekombination mischt vorhandene Allele auf neue Weise (Crossing-over/Chromosomenverteilung).","Mechanismen und Unterschied neue/neu kombiniert"],["mendelversuche","Rekonstruieren Sie Mendels Versuch über die Generationen P, F₁ und F₂ am Beispiel AA × aa.","P AA × aa; F₁ alle Aa, violett; Kreuzung Aa × Aa; F₂ AA, Aa, Aa, aa = 1:2:1 Genotyp und 3:1 Phänotyp.","Generationen, Genotypen, Verhältnisse"],["mendelversuche","Warum beweist das erneute Auftreten eines rezessiven Merkmals in F₂, dass das rezessive Allel in F₁ nicht verschwunden ist?","F₁ ist Aa und trägt das rezessive a, obwohl violett sichtbar ist. Bei Aa × Aa kann aa entstehen und das rezessive Merkmal wieder zeigen.","Erklärung mit Aa und aa"],["mendelregeln","Eine Pflanze ist Aa, eine andere aa. Erstellen Sie ein Kreuzungsschema und bestimmen Sie Genotypen und Phänotypen.","Gameten A/a und a/a; 50 % Aa (dominant), 50 % aa (rezessiv). Verhältnis 1:1.","Gameten, alle Felder, zwei Verhältnisse"],["mendelregeln","Begründe anhand des Kreuzungsschemas Aa × Aa den Unterschied von 1:2:1 und 3:1.","Genotypen: 1 AA, 2 Aa, 1 aa; Phänotyp: AA und Aa sehen dominant gleich aus, daher 3 dominant und 1 rezessiv.","Beide Verhältnisse und vollständige Dominanz"],["mendelregeln","F₁ ist uniform, aber F₂ nicht. Erkläre mit den beiden ersten Mendel-Regeln, warum das kein Widerspruch ist.","P reinerbig AA × aa → alle F₁ Aa (Uniformität). F₁ bildet A- und a-Gameten → F₂ AA, Aa, aa (Spaltung).","1. und 2. Regel korrekt verknüpfen"],["variabilitaet","Berechne die Anzahl möglicher Chromosomenkombinationen bei vier homologen Paaren (ohne Crossing-over), und erklären Sie die Überlegung.","2⁴ = 16, weil jedes der vier homologen Paare in zwei Orientierungen verteilt werden kann.","2 hoch n, korrektes Ergebnis, Erklärung"],["grundlagen","Unterscheiden Sie Genexpression und Dominanz. Erkläre, warum «dominant» nicht bedeutet, dass ein Gen immer eingeschaltet ist.","Genexpression ist die Nutzung/Ablesung der Information eines Gens zur Herstellung von RNA beziehungsweise Protein. Dominanz beschreibt, welches Allel sich bei einem heterozygoten Genotyp in der Merkmalsausprägung zeigt. Das hängt nicht einfach von an/aus ab.","Definitionen korrekt; Verschiedenheit erklärt"],["chromosomen","Beschreibe den Aufbau eines Chromosoms vom DNA-Molekül bis zur verdichteten Struktur. Nenne die Funktionen von Histonen, Centromer und Telomeren.","DNA wickelt sich um acht Histone (Nukleosom). Viele Nukleosomen bilden mit weiteren Proteinen Chromatin, das zur Teilung stark kondensiert. Centromer: Schwesterchromatiden verbunden und Ansatzbereich für Kinetochor; Telomere: schützen DNA-Enden.","DNA, Nukleosom, Chromatin, Histone, Centromer, Telomere"],["zellzyklus","Ein Zellbild zeigt 46 Zwei-Chromatid-Chromosomen. Nenne eine passende Phase vor der Kernteilung und erläutern Sie, was in G₁, S und G₂ geschehen ist.","Beispiel: G₂. G₁: Wachstum und Zellbestandteile. S: DNA-Replikation (46 Chromosomen, 92 Chromatiden). G₂: Kontrolle und Vorbereitung.","Phasen richtig; 46 Chromosomen trotz Replikation"],["mitose","Ordne die Begriffe Spindelapparat, Nucleolus, Kernhülle, Äquatorialebene und Ein-Chromatid-Chromosom den wichtigsten Mitosephasen zu.","Prophase: Chromatin kondensiert, Spindel bildet sich, Nucleolus verschwindet, Kernhülle baut sich in Pro-/Prometaphase ab. Metaphase: Chromosomen an Äquatorialebene. Anaphase: Schwesterchromatiden trennen sich zu Ein-Chromatid-Chromosomen. Telophase: Kernhülle/Nucleolus neu, Chromosomen dekondensieren. Cytokinese: Zellplasma teilt sich.","Alle vier Kernphasen und Cytokinese; Schlüsselbegriffe korrekt"],["meiose","Gehen Sie die acht Phasen der Meiose I und II in korrekter Reihenfolge durch. Sagen Sie bei jeder Anaphase, was getrennt wird.","Prophase I: Paarung/Crossing-over, Metaphase I: homologe Paare, Anaphase I: homologe Chromosomen getrennt, Telophase I: 2 haploide Kerne. Prophase II: neuer Spindelapparat, Metaphase II: Chromosomen einzeln, Anaphase II: Schwesterchromatiden getrennt, Telophase II: vier haploide Kerne (typisches Modell). Cytokinesen teilen das Zellplasma.","Reihenfolge aller Phasen; Anaphase I/II unterschieden; haploides Ergebnis"],["variabilitaet","Eine Zeichnung zeigt vor der Meiose die homologen Allelkombinationen AB und ab. Erkläre, wodurch die Kombinationen Ab und aB entstehen können. Vergleiche dies mit interchromosomaler Rekombination.","Durch Crossing-over in der Prophase I tauschen Nicht-Schwesterchromatiden homologer Chromosomen entsprechende DNA-Stücke aus (intrachromosomal), so entstehen Ab und aB. Interchromosomal meint die unabhängige zufällige Ausrichtung und Verteilung ganzer homologer Chromosomen in der Meiose I.","Zeitpunkt und Beteiligte; AB/ab → Ab/aB; inter-/intrachromosomal"],["mendelversuche","Nenne die fünf Arbeitsschritte von Mendels kontrollierter Erbsenkreuzung und begründen Sie bei jedem, weshalb er nötig war.","Reinerbige Elternlinien wählen (klarer Start); Staubblätter vor Selbstbestäubung entfernen (keine Selbstbefruchtung); ausgewählten Pollen übertragen (gezielte Kreuzung); Blüte einhüllen (keine Fremdbestäubung durch andere Pflanzen); Samen ziehen und Generationen weiterkreuzen (Beobachtung F₁/F₂).","Fünf Schritte mit jeweiliger Begründung"],["mendelregeln","Vergleiche die F₁- und F₂-Generation beim dominant-rezessiven (AA × aa) und intermediären Erbgang (RR × WW). Verwenden Sie Genotyp und Phänotyp.","Vollständige Dominanz: F₁ alle Aa, alle dominant; F₂ bei Aa × Aa: 1 AA : 2 Aa : 1 aa (Genotyp), 3 dominant : 1 rezessiv (Phänotyp). Intermediär: F₁ alle RW, alle rosa; F₂ bei RW × RW: 1 RR rot : 2 RW rosa : 1 WW weiss, also Phänotyp 1:2:1.","Uniformität, beide F₂-Verhältnisse, Genotyp versus Phänotyp"]]}</script><script>'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const CH=DATA.chapters, QS=DATA.questions, WR=DATA.transfers;
const KEY='genetik-lernstudio-mobile-2026-v2';

let store={...DEFAULT};let storageOK=true;
try {const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d && typeof d==='object')store={...DEFAULT,...d};}catch(e){storageOK=false;}
let ui={view:'home',ch:store.last?.ch||'grundlagen',step:store.last?.step||0,fig:{mitosis:0,meiosis:0,cycle:0,cross:false,chr:'two',karyoSex:'XX',trisomy:false,mendel:0,trait:'dominant',parentA:'AA',parentB:'aa'},review:false,showRecall:false,showModel:{},session:store.active||null,result:null,topic:'all',practiceSize:6,plan:store.plan||15,flash:null,gloss:'',writeTopic:'all',writeOnly:false,examNum:1,helpFrom:'home',revealDetails:false,showTip:false};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=id=>document.getElementById(id);
function save(){try {if(!storageOK)return;store.active=ui.session;localStorage.setItem(KEY,JSON.stringify(store));}catch(e){storageOK=false;}}
function icon(name){const v={home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4Z"/>',check:'<path d="m20 6-11 11-5-5"/>',bar:'<rect x="3" y="11" width="4" height="9" rx="1"/><rect x="10" y="5" width="4" height="15" rx="1"/><rect x="17" y="8" width="4" height="12" rx="1"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',focus:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',question:'<circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1 .7-1.5 1.3-1.5 2.5M12 17h.01"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',shuffle:'<path d="m18 14 4 4-4 4M2 18h2a5 5 0 0 0 4-2l8-10a5 5 0 0 1 4-2h2M18 2l4 4-4 4M2 6h2a5 5 0 0 1 4 2l1 1m4 6 3 3a5 5 0 0 0 4 2h2"/>',share:'<path d="M12 16V3m0 0L7 8m5-5 5 5"/><path d="M4 13v7h16v-7"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 18v3h16v-3"/>',pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',light:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.8.6 1 1.3 1 3.3h6c0-2 .2-2.7 1-3.3A7 7 0 0 0 12 2"/>',bookmark:'<path d="M5 3h14v18l-7-5-7 5z"/>',refresh:'<path d="M3 11a9 9 0 0 1 15-6l3 3M21 3v5h-5M21 13a9 9 0 0 1-15 6l-3-3M3 21v-5h5"/>',settings:'<path d="M12 2v2m0 16v2M4 12H2m20 0h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/><circle cx="12" cy="12" r="4"/>',close:'<path d="m18 6-12 12M6 6l12 12"/>',star:'<path d="m12 2 3 6.6 7.2.8-5.3 5 1.5 7.2-6.4-3.6-6.4 3.6 1.5-7.2-5.3-5 7.2-.8z"/>',note:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'};return `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">${v[name]||v.star}</svg>`;}
function chBy(id){return CH.find(x=>x.id===id)||CH[0];}
function qsFor(id){return QS.map((q,i)=>({q,i})).filter(x=>!id||x.q.ch===id);}
function countStatus(){let read=CH.filter(c=>store.lessons[c.id]?.read).length;let done=Object.values(store.questions).filter(q=>q.ok).length;let seen=Object.values(store.questions).filter(q=>q.attempts>0).length;let flagged=Object.entries(store.questions).filter(([i,q])=>q.attempts>0&&(!q.ok||q.flag)).length;return {read,done,seen,flagged};}
function now(){return new Date().toLocaleDateString('de-CH',{day:'numeric',month:'short'});}
function named(){return CH.map(c=>c.id);}
function studyScore(id){const a=qsFor(id);const ok=a.filter(o=>store.questions[o.i]?.ok).length;return {done:ok,total:a.length};}
function lessonLen(c){return c.segments.length+4;}
function savePosition(){store.last={ch:ui.ch,step:ui.step};save();}
function toast(msg){const t=el('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2800);}
function route(v,opts={}){const was=ui.view;ui.view=v;if(opts.ch)ui.ch=opts.ch;if(Number.isInteger(opts.step))ui.step=opts.step;if(opts.reset!==false){ui.showRecall=false;ui.showModel={};ui.showTip=false;}if(!['session','result'].includes(v))ui.session=null;savePosition();render();window.scrollTo({top:0,behavior:'instant'});if(opts.push!==false){const hash=v==='lesson'?`#/lesson/${ui.ch}/${ui.step}`:`#/${v}`;if(location.hash!==hash)history.pushState(null,'',hash);} }
function topState(){el('top-topic').textContent=ui.view==='lesson'?chBy(ui.ch).title:({home:'Genetik',learn:'Lernkapitel',practice:'Üben',exam:'Probetests',progress:'Mein Stand',write:'Schriftlich',flash:'Karteikarten',gloss:'Nachschlagen',plan:'Lernplan',help:'Hilfe',session:'Übungsrunde',result:'Auswertung',install:'Handy-App'}[ui.view]||'Genetik');document.body.classList.toggle('focus',!!store.focus);el('focusbtn').classList.toggle('active',!!store.focus);el('focusbtn').setAttribute('aria-pressed',String(!!store.focus));el('focusbtn').title=store.focus?'Fokusmodus ausschalten':'Fokusmodus einschalten';for(const n of document.querySelectorAll('[data-nav]')){let v=n.dataset.nav;let is=v===(ui.view==='lesson'?'learn':ui.view==='session'?'practice':ui.view==='result'?'practice':ui.view);n.classList.toggle('active',is);n.setAttribute('aria-current',is?'page':'false');}}
function render(){topState();let html=({home:home,learn:learn,lesson:lesson,practice:practice,session:sessionPage,exam:exam,progress:progress,write:writing,flash:flashPage,plan:plan,gloss:gloss,help:help,install:install,result:result})[ui.view]||home;el('view').innerHTML=html();el('view').classList.remove('enter');void el('view').offsetWidth;el('view').classList.add('enter');if(clockInterval){clearInterval(clockInterval);clockInterval=null;}if(ui.view==='session'&&ui.session?.kind==='exam'&&ui.session?.clockOn){tickClock();clockInterval=setInterval(tickClock,1000);}}
function intro(kicker,title,subtitle){return `<div class="head-intro"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${subtitle}</p></div>`;}
function cta(label,act,style=''){return `<button type="button" class="btn ${style}" data-action="${act}">${label}</button>`;}
const HERO=`<svg viewBox="0 0 220 260" role="img" aria-label="Stilisierte DNA-Doppelhelix"><path d="M70 15 C175 70 45 132 146 240" fill="none" stroke="#2c7365" stroke-width="12" stroke-linecap="round"/><path d="M148 15 C48 70 169 132 72 240" fill="none" stroke="#dc967e" stroke-width="12" stroke-linecap="round"/>${Array.from({length:10},(_,i)=>{let y=23+i*23,x1=100+33*Math.sin(i*.95),x2=112-33*Math.sin(i*.95);return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#8bada1" stroke-width="8" stroke-linecap="round"/>`}).join('')}<circle cx="171" cy="32" r="7" fill="#9cbaa8"/><circle cx="37" cy="195" r="10" fill="#efb9a2"/></svg>`;
function home(){let st=countStatus();let next=CH.find(c=>!store.lessons[c.id]?.read)||CH[0];let last=chBy(store.last?.ch||next.id);return `<div class="hero"><div><div class="eyebrow">Dein Lernstudio · Biologie</div><h1>Bio-Prüfung.<br>Genetik.</h1><p>Der Prüfungsstoff in zehn Themen. Du kannst etwas nachlesen, direkt üben oder einen Probetest machen.</p>${cta(`Weiter bei «${E(last.title)}» ${icon('right')}`,'resume','primary')}</div><div class="hero-visual">${HERO}</div></div>

function topicRow(c,i){let done=store.lessons[c.id]?.read;let score=studyScore(c.id);let sub=done?(score.done>0?`${score.done}/${score.total} Fragen richtig`:'Gelesen · Übungen offen'):c.summary;return `<button type="button" class="topic" data-lesson="${c.id}"><span class="topic-index">${String(i+1).padStart(2,'0')}</span><span class="grow"><b>${E(c.title)}</b><small>${E(sub)}</small></span>${done?`<span class="check">${icon('check')}</span>`:`<span style="color:#81978b">${icon('right')}</span>`}</button>`;}
function learn(){const st=countStatus();return `${intro('Lernen','Die Lernkapitel','Jedes Kapitel besteht aus kurzen Abschnitten, einer Zeichnung und einer Frage zum Selbsterklären. Du kannst jederzeit hin- und herspringen.')}
<div class="card" style="margin-bottom:16px;background:#eaf2e9"><div class="row between"><b>${st.read} von 10 Themen gelesen</b><span class="mini">${Math.round(st.read/10*100)} %</span></div><div class="pbar"><span style="width:${st.read*10}%"></span></div><p class="mini" style="margin:8px 0 0">«Gelesen» heisst nicht automatisch «kann ich». Dafür sind die Übungen da.</p></div>

function lesson(){const c=chBy(ui.ch);let max=lessonLen(c),step=Math.min(ui.step,max-1);ui.step=step;let title,inner,kicker;let introStep=step===0,segmentStep=step>=1&&step<=c.segments.length,figStep=step===c.segments.length+1,recallStep=step===c.segments.length+2,finishStep=step===c.segments.length+3;
 if(introStep){title=c.intro_title;kicker='Das ist der Punkt';inner=`<p style="font-size:18px;line-height:1.65">${E(c.intro)}</p><div class="keylist">${c.goals.slice(0,4).map(a=>`<div class="keyitem">${E(a)}</div>`).join('')}</div><div class="note-box"><b>Beim Lernen:</b> ${E(c.coach)}</div>`;}
 if(segmentStep){let n=step-1;kicker=`Erklärung ${n+1} von ${c.segments.length}`;title=segmentTitles[c.id]?.[n]||['Die Grundlage','Schau genauer hin','Wichtige Einzelheiten','Noch ein Schritt','Die letzte Unterscheidung'][n]||'Genauer erklärt';inner=`<div class="reading">${c.segments[n]}</div>`;}
 if(figStep){title=figureTitles[c.id]||'So sieht das aus';kicker='Zum Anschauen';inner=`<p class="muted" style="font-size:14px;margin-bottom:10px">Tippe auf die Schaltflächen unter der Zeichnung. Du kannst alles mehrmals durchgehen.</p>${figure(c.figure)}`;}
 if(recallStep){title='Jetzt ohne Vorlage';kicker='Im Kopf erklären';inner=`<p style="font-size:18px;font-weight:680;line-height:1.5">${E(c.recall[0])}</p><p class="mini">Sag die Antwort laut oder schreib ein paar Stichworte. Erst danach die Lösung aufklappen.</p><textarea class="recall-input" id="recallText" placeholder="Deine Antwort oder ein paar Stichworte …">${E(store.writing['recall-'+c.id]||'')}</textarea><div class="buttonset">${cta(ui.showRecall?'Lösung ausblenden':'Musterantwort zeigen','recall','mint small')}</div>${ui.showRecall?`<div class="model"><b>Das sollte in deiner Antwort vorkommen</b><p>${E(c.recall[1])}</p></div>`:''}`;}
 if(finishStep){title='Das war das Kapitel';kicker='Kurz zusammenfassen';inner=`<p class="muted">Diese Punkte solltest du aus dem Kopf erklären können:</p><div class="keylist">${c.keys.map(x=>`<div class="keyitem">${E(x)}</div>`).join('')}</div><div class="note-box"><b>Eine häufige Verwechslung:</b> ${E(c.trap)}</div><div class="buttonset">${cta('3 Fragen zu diesem Thema','topic3','primary')}${cta('Schriftlich erklären','topicwrite','mint')}</div>`;if(!store.lessons[c.id]?.read){store.lessons[c.id]={read:true,date:Date.now()};save();}}
 return `<div data-view="lesson" class="lessonmain"><div class="lessonbar"><button class="backlink" data-nav="learn">${icon('left')} Themen</button><span class="steplabel">${step+1} von ${max}</span></div><div class="lesson-head"><div class="eyebrow">Kapitel ${String(CH.indexOf(c)+1).padStart(2,'0')} · ${E(c.tag)}</div><h1>${E(c.title)}</h1><p>${E(c.summary)}</p></div><div class="steptrack" role="group" aria-label="Lernschritte">${Array.from({length:max},(_,i)=>`<button title="Schritt ${i+1}" aria-label="Schritt ${i+1}" class="${i===step?'current':i<step?'passed':''}" data-step="${i}"></button>`).join('')}</div><section class="learning-card"><div class="lessonkick">${E(kicker)}</div><h2>${E(title)}</h2>${inner}</section><div class="buttonset" style="justify-content:flex-end;margin:10px 0 0"><button class="btn ghost small" data-action="lessontip">${icon('light')} ${ui.showTip?'Hilfe schliessen':'Wenn du festhängst'}</button></div>${ui.showTip?`<div class="coachtip" style="margin-top:10px"><b>Versuch es so:</b><p>${E(c.coach)} Lies oder erkläre erst nur diesen einen Punkt. Du kannst jederzeit zurückspringen.</p></div>`:''}<div class="lesson-footer">${cta(`${icon('left')} Zurück`,'stepback','','')}${cta(step===max-1?'Weiteres Thema auswählen':`Weiter ${icon('right')}`,'stepnext','primary')}</div>${step===max-1?`<button class="btn ghost full" style="margin-top:10px" data-action="nextchapter">Nächstes Kapitel ${icon('right')}</button>`:''}<p class="mini" style="text-align:center;margin-top:15px">Dein Stand bleibt auf diesem Gerät gespeichert.</p></div>`;}

function seedShuffle(items,seed){let arr=items.slice(),s=(seed|0)||143;for(let i=arr.length-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)|0;let k=(s>>>0)%(i+1);[arr[i],arr[k]]=[arr[k],arr[i]];}return arr;}
function startSession(kind,ids,name,examNum){if(!ids.length){toast('Hier sind noch keine Fragen zum Wiederholen.');return;}
 ui.session={kind,ids,pos:0,answers:{},selected:null,picked:[],input:'',checked:false,name,examNum:examNum||0,started:Date.now(),clockOn:false,hints:0};store.active=ui.session;save();route('session');}
function pool(scope){return qsFor(scope==='all'?null:scope).map(x=>x.i);}
function chosenIds(scope,n,extra=0){let ids=pool(scope);let unseen=ids.filter(i=>!store.questions[i]?.attempts);let wrong=ids.filter(i=>store.questions[i]?.attempts&&(!store.questions[i].ok||store.questions[i].flag));let right=ids.filter(i=>store.questions[i]?.ok&&!store.questions[i].flag);let today=Math.floor(Date.now()/86400000);let seed=9481+today*3+extra;let a=[...seedShuffle(wrong,seed+1),...seedShuffle(unseen,seed+2),...seedShuffle(right,seed+3)];return a.slice(0,Math.min(n,a.length));}
function examIds(num){let ids=[];for(const [i,c] of CH.entries()){const all=qsFor(c.id);const harder=all.filter(x=>x.q.level>=2),easy=all.filter(x=>x.q.level===1);const a=seedShuffle(harder,9876+num*191+i*13);const b=seedShuffle(easy,987+num*61+i*29);const picks=[a[num%a.length]||b[0],b[(num+i)%b.length]||a[0]].filter(Boolean);for(const p of picks)if(!ids.includes(p.i))ids.push(p.i);}return seedShuffle(ids,429+num*111);}

const QUESTION_TIPS={grundlagen:'Frag dich: Geht es um einen DNA-Abschnitt, eine Genvariante oder ein sichtbares Merkmal?',fortpflanzung:'Überlege, ob Gameten verschmelzen und ob die Erbinformation neu gemischt wird.',chromosomen:'Unterscheide: Schwesterchromatiden sind Kopien, homologe Chromosomen stammen aus dem Paar.',karyogramm:'Zähle zuerst die Chromosomen. Danach kontrolliere die Paare und die Nummer 21.',zellzyklus:'In der S-Phase wird die DNA kopiert. Die Mitose kommt danach.',mitose:'Mitose trennt Schwesterchromatiden. Denk an Prophase → Metaphase → Anaphase → Telophase.',meiose:'Bei Meiose I trennen sich homologe Paare, bei II die Schwesterchromatiden.',variabilitaet:'Interchromosomal betrifft ganze Chromosomen. Intrachromosomal betrifft DNA-Abschnitte.',mendelversuche:'Bei jedem Versuchsschritt: Was wollte Mendel kontrollieren oder verhindern?',mendelregeln:'Schreib die Genotypen auf und leite die möglichen Gameten ab. Erst danach die Nachkommen.'};
function hintText(q,s){if(!s.hints)return '';if(s.hints===1)return QUESTION_TIPS[q.ch]||'Lies die Frage noch einmal und suche das entscheidende Fachwort.';if(q.type==='choice'){let wrong=q.opts.map((_,i)=>i).filter(i=>i!==q.ans);return 'Du kannst '+wrong.slice(0,2).map(i=>'Antwort '+('ABCD'[i])).join(' und ')+' streichen.';}if(q.type==='fill')return 'Der Begriff beginnt mit «'+String(q.answers[0]).slice(0,Math.max(2,Math.floor(String(q.answers[0]).length/3)))+'…».';return 'Der erste Schritt ist: '+q.items[0];}

function questionBody(q,s){if(q.type==='choice'){return `<div class="qchoices">${q.opts.map((opt,i)=>{let chosen=s.selected===i;let done=s.checked&&s.kind!=='exam',cls=done?(i===q.ans?'correct':chosen?'wrong':''):chosen?'selected':'';return `<button type="button" class="choice ${cls}" data-answer="${i}" ${done?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${E(opt)}</span>${done&&i===q.ans?`<span style="margin-left:auto;color:#24744c">${icon('check')}</span>`:''}</button>`}).join('')}</div>`;}
 if(q.type==='fill'){return `<div><label class="mini" for="answerInput">Deine Antwort</label><input class="answerfield" type="text" id="answerInput" placeholder="Ein Wort oder ein kurzer Begriff" autocomplete="off" autocapitalize="sentences" value="${E(s.input||'')}" ${s.checked?'disabled':''}><p class="mini" style="margin:7px 0 0">Gross- und Kleinschreibung zählt hier nicht.</p></div>`;}
 if(q.type==='order'){let chosen=s.picked||[];let order=seedShuffle(q.items.map((_,i)=>i),s.started+s.pos*197);if(order.every((v,i)=>v===i))order.push(order.shift());return `<div><p class="mini">Tippe die Begriffe in der richtigen Reihenfolge an:</p><div class="order-picked">${chosen.length?chosen.map((i,pos)=>`<span class="chosen">${E(q.items[i])}</span>`).join('<span aria-hidden="true">→</span>'):'<span class="mini">Hier erscheint deine Reihenfolge.</span>'}</div><div class="order-picks">${order.map(i=>`<button type="button" data-pick="${i}" ${chosen.includes(i)||s.checked?'disabled class="picked"':''}>${E(q.items[i])}</button>`).join('')}</div><button type="button" class="btn small ghost" data-action="resetorder" style="margin-top:8px">Reihenfolge löschen</button></div>`;}
 return '';
}
function sessionPage(){let s=ui.session;if(!s){return `${intro('Üben','Keine Runde offen','Wähle auf der Übungsseite eine Runde.')}${cta('Zu den Übungen','backpractice','primary')}`;}const id=s.ids[s.pos],q=QS[id],ans=s.answers[s.pos],progress=s.pos+1,examMode=s.kind==='exam';return `<div data-view="session" class="lessonmain"><div class="lessonbar"><button class="backlink" data-action="endsession">${icon('left')} ${examMode?'Testübersicht':'Übungen'}</button><span class="steplabel">${progress} von ${s.ids.length}</span></div><div class="head-intro" style="margin-bottom:15px"><div class="eyebrow">${examMode?'Probetest '+s.examNum:s.name}</div><h1 style="font-size:27px">${examMode?'Prüfungsfragen':'Eine Frage nach der anderen'}</h1>${examMode?'<p>Im Probetest siehst du die Lösungen erst am Schluss.</p>':''}</div><div class="exam-progress">${s.ids.map((_,i)=>`<span class="${i<s.pos?'done':i===s.pos?'now':''}"></span>`).join('')}</div>${examMode?`<div class="row between wrap" style="margin:0 0 11px"><span class="mini" id="examclock">${s.clockOn?'Laufzeit: --:--':'Ohne Zeitdruck'}</span><button class="btn small ghost" data-action="toggleclock">${s.clockOn?'Zeit ausblenden':'Zeit anzeigen'}</button></div>`:''}
<section class="qcard"><span class="tag ${q.level>=2?'purple':''}">${E(chBy(q.ch).title)} · ${q.level===2?'Vertiefung':'Grundwissen'}</span><h2 class="qtitle">${E(q.q)}</h2>${questionBody(q,s)}${!examMode&&!s.checked?`<div class="buttonset"><button class="btn small ghost" data-action="qhint">${icon('light')} ${s.hints===0?'Kleinen Hinweis zeigen':s.hints===1?'Noch ein Hinweis':'Hinweise gezeigt'}</button></div>${s.hints?`<div class="note-box">${E(hintText(q,s))}</div>`:''}`:''}${s.checked&&!examMode?`<div class="q-feedback ${ans?.ok?'':'no'}"><b>${ans?.ok?'Richtig.':'Das war noch nicht richtig.'}</b><p>${E(q.why)}</p>${!ans?.ok?`<p style="margin-top:9px"><b>Richtige Antwort:</b> ${E(correctString(q))}</p>`:''}</div>`:''}<div class="session-footer">${!s.checked?cta(examMode?'Antwort übernehmen':'Antwort prüfen','checkanswer','primary full'):cta(s.pos===s.ids.length-1?(examMode?'Test auswerten':'Runde abschliessen'):'Nächste Frage','nextq','primary full')}</div>${s.checked&&!examMode?`<div class="buttonset" style="justify-content:space-between"><button class="btn ghost small" data-action="qflag">${icon('bookmark')} ${store.questions[id]?.flag?'Nicht mehr markieren':'Für später merken'}</button><button class="btn ghost small" data-action="qread">${icon('book')} Im Kapitel nachlesen</button></div>`:''}</section>${!examMode&&s.pos===0?'<p class="mini center" style="margin-top:12px">Du kannst eine Übungsrunde jederzeit beenden. Deine bisherigen Antworten bleiben gespeichert.</p>':''}</div>`;}
function correctString(q){return q.type==='choice'?q.opts[q.ans]:q.type==='fill'?q.answers.join(' / '):q.items.join(' → ');}
function norm(a){return String(a??'').trim().toLocaleLowerCase('de-CH').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[.\s'’\-_,:;!?]/g,'');}
function getAnswer(s,q){if(q.type==='choice')return Number.isInteger(s.selected)?s.selected:null;if(q.type==='fill')return (s.input||'').trim();if(q.type==='order')return s.picked.slice();return null;}
function answerOK(q,response){if(q.type==='choice')return response===q.ans;if(q.type==='fill')return q.answers.some(x=>norm(response)===norm(x));if(q.type==='order')return Array.isArray(response)&&response.length===q.items.length&&response.every((i,pos)=>i===pos);return false;}
function storeQuestion(id,ok,helped=false){const before=store.questions[id]||{};store.questions[id]={...before,ok,attempts:(before.attempts||0)+1,at:Date.now(),flag:(!ok)||helped||before.flag||false};save();}
function checkAnswer(){let s=ui.session;if(!s||s.checked)return;const id=s.ids[s.pos],q=QS[id],res=getAnswer(s,q);if(res===null||res===''||Array.isArray(res)&&res.length!==q.items.length){toast('Wähle zuerst eine Antwort.');return;}const ok=answerOK(q,res);s.answers[s.pos]={ok,response:res};s.checked=true;storeQuestion(id,ok,s.hints>0);save();render();}
function nextQuestion(){let s=ui.session;if(!s)return;if(!s.checked){toast('Prüfe zuerst deine Antwort.');return;}if(s.pos>=s.ids.length-1){finishSession();return;}s.pos++;s.checked=false;s.selected=null;s.input='';s.picked=[];s.hints=0;save();render();window.scrollTo({top:0,behavior:'instant'});}
function finishSession(){let s=ui.session;if(!s)return;let correct=Object.values(s.answers).filter(x=>x.ok).length;ui.result={...s,correct,date:Date.now()};if(s.kind==='exam'){store.exams.unshift({num:s.examNum,correct,total:s.ids.length,date:Date.now()});store.exams=store.exams.slice(0,20);}ui.session=null;store.active=null;save();route('result');}

<div class="grid3">${[1,2,3].map(i=>{let ex=store.exams.find(x=>x.num===i);return `<div class="card" style="display:flex;flex-direction:column"><span class="tag gray">Test ${i}</span><h2 style="font-size:27px;margin:13px 0 9px">20 Fragen</h2><p class="muted small" style="flex:1">${ex?`Letztes Mal: ${ex.correct}/${ex.total} richtig · ${new Date(ex.date).toLocaleDateString('de-CH')}`:'Alle Themen gemischt. Ohne Hinweise während des Tests.'}</p>${cta('Test starten','exam'+i,'primary full')}</div>`}).join('')}</div><div class="coachtip" style="margin-top:17px"><b>So nutzt du die Tests sinnvoll:</b><p>Mach zuerst einen Test ohne Nachschauen. Danach nur die Fehler wiederholen. Den nächsten Test machst du später oder morgen, nicht direkt dreimal hintereinander.</p></div>`;}
function writing(){let items=WR.map((x,i)=>({x,i})).filter(({x,i})=>(ui.writeTopic==='all'||x[0]===ui.writeTopic)&&(!ui.writeOnly||store.ratings[i]!=='secure'));return `${intro('Schriftliche Aufgaben','Kannst du es erklären?','Hier geht es nicht ums Anklicken. Schreib oder sag deine Antwort, schau erst danach die Musterlösung an und entscheide selbst, ob du das kannst.')}
<div class="card" style="margin-bottom:17px"><div class="row between wrap"><label for="writeTopic" class="mini" style="font-weight:750">Thema</label><select id="writeTopic" class="selectbox" data-select="writetopic"><option value="all">Alle Themen</option>${CH.map(c=>`<option value="${c.id}" ${ui.writeTopic===c.id?'selected':''}>${E(c.title)}</option>`).join('')}</select></div><div class="buttonset"><button class="chip ${ui.writeOnly?'':'active'}" data-action="writeall">Alle Aufgaben</button><button class="chip ${ui.writeOnly?'active':''}" data-action="writeunsure">Nur noch unsichere</button></div></div>
<div class="rows">${items.length?items.map(({x,i})=>`<div class="transferitem"><div class="row between"><span class="tag">${E(chBy(x[0]).title)}</span><span class="mini">${i+1}/30</span></div><h3 style="margin-top:13px">${E(x[1])}</h3><textarea data-write="${i}" class="text-area" placeholder="Deine Antwort. Stichworte reichen zum Üben.">${E(store.writing[i]||'')}</textarea><div class="buttonset">${cta(ui.showModel[i]?'Lösung verbergen':'Musterlösung ansehen','model'+i,'mint small')}</div>${ui.showModel[i]?`<div class="model"><b>Beispielantwort</b><p>${E(x[2])}</p><div class="divider" style="margin:12px 0"></div><b>Darauf kommt es an</b><p>${E(x[3])}</p><div class="buttonset"><button class="btn small ${store.ratings[i]==='secure'?'primary':''}" data-rate="${i}:secure">Kann ich erklären</button><button class="btn small ${store.ratings[i]==='unsure'?'coral':''}" data-rate="${i}:unsure">Noch nicht sicher</button></div></div>`:''}</div>`).join(''):`<div class="card"><p>Für diese Auswahl gibt es gerade keine offenen Aufgaben.</p>${cta('Alle Aufgaben anzeigen','writeall','mint')}</div>`}</div>`;}
function makeCards(){return CH.flatMap(c=>c.keys.map((k,j)=>({id:`${c.id}:${j}`,ch:c.id,q:`Was bedeutet dieser Satz?`,cue:k.split('=')[0].trim().replace(/^[0-9.]+\s*/,''),answer:k}))).concat(CH.map(c=>({id:`extra:${c.id}`,ch:c.id,q:c.recall[0],cue:'Erklär es ohne Unterlagen.',answer:c.recall[1]})));}
function flashPage(){if(ui.flash){let f=ui.flash,all=makeCards(),card=all.find(x=>x.id===f.ids[f.pos]);if(!card){ui.flash=null;return flashPage();}return `<div class="lessonmain"><div class="lessonbar"><button class="backlink" data-action="endflash">${icon('left')} Karteikarten</button><span class="steplabel">${f.pos+1} von ${f.ids.length}</span></div><div class="head-intro"><div class="eyebrow">${E(chBy(card.ch).title)}</div><h1 style="font-size:28px">Aus dem Kopf abrufen</h1></div><div class="flash"><span class="tag purple">${E(card.q)}</span><h3>${E(card.cue)}</h3>${f.open?`<div class="model"><p>${E(card.answer)}</p></div>`:cta('Antwort zeigen','flipflash','primary')}</div>${f.open?`<div class="buttonset"><button class="btn coral" data-action="flashunsure">Noch unsicher</button><button class="btn primary" data-action="flashsecure">Das kann ich</button></div>`:'<p class="mini center" style="margin-top:15px">Sag die Antwort erst selbst – im Kopf oder laut.</p>'}</div>`;}
let cards=makeCards(),done=cards.filter(x=>store.flash[x.id]==='secure').length,unsure=cards.filter(x=>store.flash[x.id]==='unsure').length;return `${intro('Wiederholen','Karteikarten','Kurze Fragen, keine Auswahlmöglichkeiten. Besonders gut für Fachbegriffe und Unterschiede.')}
<div class="statrow" style="margin-bottom:18px"><div class="stat"><b>${cards.length}</b><span>Karten insgesamt</span></div><div class="stat"><b>${done}</b><span>Kann ich</span></div><div class="stat"><b>${unsure}</b><span>Noch unsicher</span></div></div><div class="card"><h3>Wie willst du üben?</h3><div class="buttonset">${cta('10 gemischte Karten','flashmix','primary')}${cta('Nur unsichere Karten','flashwrong','mint')}</div><p class="mini" style="margin:12px 0 0">Auch hier kannst du eine Runde jederzeit abbrechen.</p></div>`;}
function startFlash(kind){let cards=makeCards();let ids=cards.filter(x=>kind!=='wrong'||store.flash[x.id]!=='secure').map(x=>x.id);if(!ids.length){toast('Aktuell sind alle Karten als sicher markiert.');return;}ids=seedShuffle(ids,Date.now()|0).slice(0,kind==='wrong'?Math.min(ids.length,20):10);ui.flash={ids,pos:0,open:false};render();}
function nextFlash(rating){let f=ui.flash;if(!f)return;store.flash[f.ids[f.pos]]=rating;f.pos++;f.open=false;save();if(f.pos>=f.ids.length){ui.flash=null;toast('Karteikartenrunde abgeschlossen.');}render();}
function plan(){let p=ui.plan||15;let st=countStatus(),weak=CH.map(c=>({c,s:studyScore(c.id)})).sort((a,b)=>((a.s.done/a.s.total)-(b.s.done/b.s.total)))[0]?.c||CH[0];let plans={5:[['2 Min.','Zeichnung zu einem Thema anschauen.'],['3 Min.','Drei Fragen ohne Nachschauen beantworten.']],15:[['5 Min.','Ein Thema oder eine schwierige Phase nachlesen.'],['6 Min.','Sechs Fragen dazu lösen.'],['4 Min.','Fehler nochmals kurz erklären.']],30:[['10 Min.','Ein Lernkapitel lesen und die Zeichnung durchgehen.'],['10 Min.','Zehn Fragen beantworten.'],['10 Min.','Zwei schriftliche Aufgaben lösen, Lösungen vergleichen.']]};return `${intro('Lernplan','Wie viel Zeit hast du gerade?','Du musst nicht alles heute erledigen. Wähle eine Zeit, die jetzt tatsächlich passt.')}
<div class="row" style="margin-bottom:17px">${[5,15,30].map(t=>`<button class="plan-option ${p===t?'active':''}" data-plan="${t}"><b>${t} Min.</b><small>${t===5?'Kurzer Einstieg':t===15?'Konzentriert':'Mit Schreiben'}</small></button>`).join('')}</div><div class="card"><div class="eyebrow">Vorschlag für jetzt</div><h2 style="margin-bottom:19px">${p} Minuten</h2><div class="rows">${plans[p].map((x,i)=>`<div class="planrow"><span class="step-num">${i+1}</span><div><b>${x[0]}</b><p>${x[1]}</p></div></div>`).join('')}</div><div class="buttonset">${cta('Bei einem Thema anfangen','planlearn','primary')}${cta('Fragen starten','quick6','mint')}</div></div><div class="coachtip" style="margin-top:14px"><b>Wenn du festhängst</b><p>Schliesse die lange Erklärung. Schau nur auf die Zeichnung. Sag in einem Satz, was da passiert. Danach kannst du wieder zu den Fragen gehen. Wenn es auch dann nicht geht: anderes Thema oder fünf Minuten Pause.</p></div>`;}
function progress(){let st=countStatus();let last=CH.find(c=>!store.lessons[c.id]?.read)||CH[0];return `${intro('Dein Stand','Was du schon bearbeitet hast','Die Anzeige ist für dich, nicht als Note. Eine richtige Antwort beim ersten Mal ist etwas anderes als ein Thema sicher erklären zu können.')}
<div class="statrow" style="margin-bottom:18px"><div class="stat"><b>${st.read}/10</b><span>Themen gelesen</span></div><div class="stat"><b>${st.seen}/173</b><span>Fragen bearbeitet</span></div><div class="stat"><b>${st.flagged}</b><span>Zum Nachholen</span></div></div><div class="card" style="margin-bottom:14px"><h3>Als Nächstes</h3><p>Ein Kapitel, das du noch nicht gelesen hast: <b>${E(last.title)}</b>.</p>${cta('Kapitel öffnen','nextunread','primary')}</div><div class="card"><h3>Die Themen im Überblick</h3>${CH.map(c=>{let n=studyScore(c.id);return `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="row between"><b style="font-size:14px">${E(c.title)}</b><span class="mini">${n.done}/${n.total} Fragen</span></div><div class="pbar"><span style="width:${n.done/n.total*100}%"></span></div><div class="row between"><span class="mini">${store.lessons[c.id]?.read?'Gelesen':'Noch offen'}</span><button data-lesson="${c.id}" class="btn ghost small">Öffnen ${icon('right')}</button></div></div>`}).join('')}</div>

const GLOSS=[['Allel','Eine Variante eines Gens.','grundlagen'],['Autosom','Chromosom, das nicht zu den Geschlechtschromosomen gehört.','karyogramm'],['Centromer','Bereich eines Chromosoms, an dem Schwesterchromatiden zusammenhängen; Ansatz des Kinetochors.','chromosomen'],['Chromatid','Eine der beiden DNA-Protein-Einheiten eines verdoppelten Chromosoms.','chromosomen'],['Chromatin','DNA und die daran gebundenen Proteine im Zellkern.','chromosomen'],['Chromosom','Struktur aus DNA und Proteinen, die Erbinformation organisiert.','chromosomen'],['Crossing-over','Austausch von DNA-Abschnitten zwischen Nicht-Schwesterchromatiden homologer Chromosomen während Prophase I.','variabilitaet'],['Cytokinese','Teilung des Zellplasmas nach oder während der Kernteilung.','mitose'],['Diploid (2n)','Zwei Chromosomensätze; beim Menschen üblicherweise 46 Chromosomen in Körperzellen.','karyogramm'],['DNA','Molekül, das die Erbinformation speichert.','grundlagen'],['F₁','Erste Tochtergeneration aus einer Kreuzung.','mendelversuche'],['F₂','Zweite Tochtergeneration: Nachkommen einer F₁-Kreuzung.','mendelversuche'],['G₀','Zustand ausserhalb des aktiven Teilungszyklus.','zellzyklus'],['G₁','Phase des Zellzyklus: Wachstum und Zellfunktionen.','zellzyklus'],['G₂','Phase nach der DNA-Verdopplung: Kontrolle und Vorbereitung der Teilung.','zellzyklus'],['Gameten','Geschlechtszellen, beispielsweise Eizellen und Spermien.','fortpflanzung'],['Gen','DNA-Abschnitt, dessen Information für ein funktionelles Produkt verwendet wird.','grundlagen'],['Genexpression','Nutzung der genetischen Information zur Herstellung von RNA und häufig Protein.','grundlagen'],['Genotyp','Genetische Allelkombination, beispielsweise Aa.','grundlagen'],['Haploid (n)','Einfacher Chromosomensatz; beim Menschen typischerweise 23 Chromosomen in Gameten.','karyogramm'],['Heterozygot','Zwei unterschiedliche Allele eines Gens, z. B. Aa.','mendelregeln'],['Histon','Protein, um das DNA gewickelt wird.','chromosomen'],['Homolog','Gle function svg(inner,view='0 0 500 260',label='Schematische Biologiezeichnung'){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${view}" aria-label="${E(label)}" role="img" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;}
function boxrect(x,y,w,h,col='#fff',r=17){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${col}" stroke="#caddce" stroke-width="1.5"/>`;}
function lab(x,y,t,size=14,fill='#2b554b',anchor='middle',weight=650){return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-family="system-ui,Arial" font-weight="${weight}">${E(t)}</text>`;}
function xshape(x,y,color='#d98c78',scale=1){return `<path d="M ${x-12*scale} ${y-20*scale} L ${x+12*scale} ${y+20*scale} M ${x+12*scale} ${y-20*scale} L ${x-12*scale} ${y+20*scale}" stroke="${color}" stroke-width="${8*scale}" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${4.5*scale}" fill="#34554e"/>`;}
function rod(x,y,color='#ce897e',sc=1){return `<line x1="${x}" y1="${y-18*sc}" x2="${x}" y2="${y+18*sc}" stroke="${color}" stroke-width="${8*sc}" stroke-linecap="round"/>`;}
function cell(x,y,r=74){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#f9fdfa" stroke="#98c6b2" stroke-width="3"/>`;}
function desc(title,body){return `<div class="fig-desc"><strong>${E(title)}</strong><p>${E(body)}</p></div>`;}
function figure(type){switch(type){case 'basics':return figBasics();case 'reproduction':return figReproduction();case 'chromosome':return figChromosome();case 'karyogram':return figKaryo();case 'cycle':return figCycle();case 'mitosis':return figMitosis();case 'meiosis':return figMeiosis();case 'crossing':return figCrossing();case 'mendelstory':return figMendel();case 'punnett':return figPunnett();return '';}}
function figBasics(){let helix='';for(let i=0;i<10;i++){let y=55+i*18,x1=360+22*Math.sin(i*1.15),x2=360-22*Math.sin(i*1.15);helix+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#a4c9b7" stroke-width="6"/>`;}
 let v=boxrect(18,26,139,95,'#f7faf5')+lab(87,47,'Zelle',14)+`<circle cx="86" cy="92" r="32" fill="#e1f0de" stroke="#92bfa5" stroke-width="2"/><circle cx="86" cy="92" r="17" fill="#c1d9c9" stroke="#7ba895"/>`+lab(87,159,'Zellkern',13)+`<path d="M150 92 H205" stroke="#78ab95" stroke-dasharray="5 5" stroke-width="3"/>`+boxrect(205,38,112,130)+lab(261,61,'Chromosom',13)+xshape(260,109,'#cb8777',1.18)+`<path d="M317 107 H338" stroke="#78ab95" stroke-dasharray="4 5" stroke-width="3"/>`+boxrect(338,26,136,180)+helix+`<path d="M360 44 C399 73 324 129 365 206" fill="none" stroke="#c9877a" stroke-width="5"/><path d="M360 44 C320 73 396 129 355 206" fill="none" stroke="#508c78" stroke-width="5"/>`+lab(409,226,'DNA',14);return `<div class="fig-wrap"><div class="fig-title">Die Information liegt in der DNA.</div>${svg(v,'0 0 500 240','Zelle, Zellkern, Chromosom und DNA')}${desc('Die Begriffe hängen zusammen.','Die DNA ist ein Molekül. Ein Gen ist ein Abschnitt davon. Ein Allel ist eine Variante eines bestimmten Gens. Ein Chromosom trägt viele Gene.')}</div>`;}
function figReproduction(){let v=boxrect(14,17,223,218,'#f1f7f0')+boxrect(263,17,223,218,'#fff3ea');v+=lab(125,43,'Asexuell',16,'#2b6150')+lab(375,43,'Sexuell',16,'#925641');v+=cell(126,92,22)+rod(125,92,'#4a9884',.58)+`<path d="M125 120V149M125 148l-42 22M125 148l42 22" stroke="#80b0a0" stroke-width="3"/>`+cell(84,185,21)+cell(168,185,21)+rod(84,185,'#4a9884',.5)+rod(168,185,'#4a9884',.5)+lab(126,224,'ähnliche Nachkommen',12,'#3d6b5c');v+=cell(329,88,22)+cell(421,88,22)+rod(329,88,'#4a9884',.5)+rod(421,88,'#dc917f',.5)+`<path d="M334 118 374 153 417 118" fill="none" stroke="#a5bcab" stroke-width="3"/>`+cell(375,182,29)+rod(365,183,'#4a9884',.55)+rod(384,183,'#dc917f',.55)+lab(375,224,'neue Kombination',12,'#925641');return `<div class="fig-wrap">${svg(v,'0 0 500 252','Schema asexueller und sexueller Fortpflanzung')}${desc('Ein Elternteil oder neue Mischung','Asexuell: keine Verschmelzung von Gameten. Sexuell: Gameten verschmelzen; Rekombination und Befruchtung führen zu neuen Genkombinationen.')}</div>`;}

function figPunnett(){const inter=ui.fig.trait==='inter';let A=ui.fig.parentA,B=ui.fig.parentB;let options=inter?['RR','RW','WW']:['AA','Aa','aa'];if(!options.includes(A)){A=options[0];B=options[2];ui.fig.parentA=A;ui.fig.parentB=B;}

function combine(a,b){if(inter){if(a===b)return a+b;return 'RW';}return a===b?a+b:'Aa';}
function phenotype(g){if(inter)return g==='RR'?'rot':g==='WW'?'weiss':'rosa';return g==='aa'?'grün':'gelb';}
let cells=[combine(g1[0],g2[0]),combine(g1[0],g2[1]),combine(g1[1],g2[0]),combine(g1[1],g2[1])];let counts={};for(const g of cells)counts[g]=(counts[g]||0)+1;let variants=Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0]));let pheno={};for(const g of cells)pheno[phenotype(g)]=(pheno[phenotype(g)]||0)+1;

return `<div class="fig-wrap"><div class="fig-title">Ändere die Eltern und schau, was sich ergibt.</div><div class="optionline" style="margin-bottom:12px"><button class="fig-tab ${inter?'':'active'}" data-fig="trait:dominant">Dominant-rezessiv</button><button class="fig-tab ${inter?'active':''}" data-fig="trait:inter">Intermediär</button></div><div class="row between wrap" style="gap:8px"><label style="font-size:13px">Elternteil 1 <select class="selectbox" data-figselect="parentA">${options.map(g=>`<option value="${g}" ${A===g?'selected':''}>${g}</option>`).join('')}</select></label><label style="font-size:13px">Elternteil 2 <select class="selectbox" data-figselect="parentB">${options.map(g=>`<option value="${g}" ${B===g?'selected':''}>${g}</option>`).join('')}</select></label></div><div class="pea-grid"><div class="head">×</div><div class="head">${g2[0]}</div><div class="head">${g2[1]}</div><div class="head">${g1[0]}</div><div>${block(cells[0])}</div><div>${block(cells[1])}</div><div class="head">${g1[1]}</div><div>${block(cells[2])}</div><div>${block(cells[3])}</div></div><div class="squares"><div><b>Genotypen</b>${variants.map(([g,n])=>`${E(g)}: ${n*25} %`).join('<br>')}</div><div><b>Phänotypen</b>${Object.entries(pheno).map(([g,n])=>`${E(g)}: ${n*25} %`).join('<br>')}</div></div>${desc('Vier Felder = vier gleich wahrscheinliche Kombinationen in diesem Modell',inter?'Bei intermediärem Erbgang liegt RW in der Mitte (rosa). Bei RW × RW ist das Phänotypverhältnis 1 rot : 2 rosa : 1 weiss.':'Bei vollständiger Dominanz sind AA und Aa im Beispiel beide gelb, aa ist grün. Bei Aa × Aa ist das Phänotypverhältnis 3:1.')}</div>`;}

 case 'nextunread':route('lesson',{ch:CH.find(c=>!store.lessons[c.id]?.read)?.id||'grundlagen',step:0});break;
 case 'export':exportData();break;
 case 'import':el('importFile')?.click();break;
 case 'resetask':if(confirm('Den gesamten Lernstand auf diesem Gerät löschen? Das kann nicht rückgängig gemacht werden.')){store={...DEFAULT};save();ui.session=null;toast('Lernstand zurückgesetzt.');route('home');}break;
 case 'share':share();break;
 case 'focus':store.focus=!store.focus;save();topState();toast(store.focus?'Fokusmodus an.':'Fokusmodus aus.');break;
 case 'goLearn':route('learn');break;
 case 'goPractice':route('practice');break;

document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.select==='topic'){ui.topic=t.value;}else if(t.dataset.select==='writetopic'){ui.writeTopic=t.value;render();}else if(t.dataset.figselect){ui.fig[t.dataset.figselect]=t.value;renderFigure();}else if(t.id==='importFile')importData(t.files?.[0]);});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='answerInput'&&ui.session){ui.session.input=t.value;save();}else if(t.id==='recallText'){store.writing['recall-'+ui.ch]=t.value;save();}else if(t.dataset.write!==undefined){store.writing[t.dataset.write]=t.value;save();}else if(t.id==='glossInput'){ui.gloss=t.value;el('glossrows').innerHTML=glossRows(GLOSS.filter(x=>(x[0]+' '+x[1]).toLocaleLowerCase('de').includes(ui.gloss.toLocaleLowerCase('de'))).sort((a,b)=>a[0].localeCompare(b[0],'de')));}});
window.addEventListener('popstate',()=>{const arr=location.hash.replace(/^#\/?/,'').split('/');if(arr[0]==='lesson'&&chBy(arr[1])){ui.ch=arr[1]||'grundlagen';ui.step=Math.min(lessonLen(chBy(ui.ch))-1,Math.max(0,+arr[2]||0));ui.view='lesson';}else if(['home','learn','practice','exam','progress','write','flash','plan','gloss','help','install'].includes(arr[0]))ui.view=arr[0];render();});
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&store.focus){store.focus=false;save();topState();}if(e.target.closest('textarea,input,select'))return;if(ui.view==='lesson'&&e.key==='ArrowRight'){ui.step=Math.min(lessonLen(chBy(ui.ch))-1,ui.step+1);route('lesson',{step:ui.step});}else if(ui.view==='lesson'&&e.key==='ArrowLeft'){ui.step=Math.max(0,ui.step-1);route('lesson',{step:ui.step});}});
// Restore a direct topic link without reloading the document; front-end is one file.
let h=location.hash.replace(/^#\/?/,'').split('/');if(h[0]==='lesson'&&CH.some(c=>c.id===h[1])){ui.view='lesson';ui.ch=h[1];ui.step=Math.min(lessonLen(chBy(ui.ch))-1,Math.max(0,Number(h[2])||0));}else if(h[0]==='session'&&ui.session){ui.view='session';}else if(['learn','practice','exam','progress','write','flash','plan','gloss','help','install'].includes(h[0]))ui.view=h[0];
render();
