<script id="data" type="application/json">{"chapters":[{"id":"grundlagen","title":"Genetik und Vererbung","tag":"Grundlagen","minutes":12,"summary":"Wie gelangen Erbinformationen von Eltern zu Nachkommen?","goals":["Genetik, Gen, Allel, Genotyp und Phänotyp unterscheiden","Erklären, warum Geschwister einander ähneln, aber verschieden sind","Genexpression von dominant/rezessiv abgrenzen","Variation und Variabilität unterscheiden"],"keys":["Gen = DNA-Abschnitt","Allel = Genvariante","Genotyp = Allelkombination","Phänotyp = sichtbare/ermittelbare Ausprägung","Genexpression = Nutzung genetischer Information","Dominanz beschreibt das Zusammenspiel von Allelen"],"trap":"Genotyp und Phänotyp sind nicht dasselbe. Nicht jedes Merkmal folgt einem einfachen A/a-Schema.","intro_title":"Gene, Allele, Merkmale","intro":"Genetik klingt schnell kompliziert. Es geht zuerst nur darum, wo die Informationen liegen und was davon man später erkennen kann.","coach":"Wenn du Gen, Allel, Genotyp und Phänotyp auseinanderhalten kannst, ist der Rest deutlich einfacher.","segments":["<p><strong>Genetik<\/strong> ist die Lehre von der Vererbung und der Veränderung von Erbinformation. Bei der Fortpflanzung geben Eltern genetische Informationen an ihre Nachkommen weiter. Diese beeinflussen viele Merkmale – beispielsweise Blutgruppen, Blütenfarben und bestimmte Erbkrankheiten.<\/p><p>Eine <strong>DNA<\/strong> ist ein langes Molekül, in dem biologische Information gespeichert ist. Ein <strong>Gen<\/strong> bezeichnet einen DNA-Abschnitt, der zur Herstellung eines funktionellen Produkts (beispielsweise eines Proteins oder einer RNA) beiträgt. Auf einem Chromosom liegen sehr viele Gene. Verschiedene Varianten eines Gens heissen <strong>Allele<\/strong>.<\/p><div class=\"example\"><strong>Beispiel Erbsen:<\/strong> Für ein vereinfachtes Modell der Blütenfarbe steht <b>A<\/b> für das dominante Allel „violett“ und <b>a<\/b> für das rezessive Allel „weiss“. <b>AA<\/b> und <b>Aa<\/b> führen zu violetten Blüten, <b>aa<\/b> zu weissen. Das ist ein Modell eines dominant-rezessiven Erbgangs, nicht ein allgemeines Gesetz für alle Merkmale.<\/div>","<p>Der <strong>Genotyp<\/strong> beschreibt die Allelkombination (beispielsweise Aa). Der <strong>Phänotyp<\/strong> ist die beobachtbare Ausprägung (hier: violette Blüte). Der Phänotyp kann auch von Umweltbedingungen und vielen verschiedenen Genen beeinflusst werden.<\/p><div class=\"compare\"><div><h4>Homozygot (reinerbig)<\/h4><p>Beide Allele gleich: AA oder aa.<\/p><\/div><div><h4>Heterozygot (mischerbig)<\/h4><p>Zwei verschiedene Allele: Aa.<\/p><\/div><\/div><p><strong>Merken:<\/strong> Dominant bedeutet, dass sich ein Allel bei Heterozygotie im Phänotyp zeigt. Es bedeutet <em>nicht<\/em> „häufiger“, „stärker“ oder „besser“.<\/p>","<h3>Vererbung, Variation und Genexpression – die Unterschiede<\/h3><div class=\"compare\"><div><h4>Variation<\/h4><p>Einzelne beobachtbare Unterschiede zwischen Individuen – beispielsweise zwei Erbsen mit unterschiedlicher Samenfarbe.<\/p><\/div><div><h4>Variabilität<\/h4><p>Die Vielfalt möglicher Merkmalsausprägungen in einer Gruppe/Art; sie hängt von genetischen Unterschieden und teilweise von Umweltbedingungen ab.<\/p><\/div><\/div><p><strong>Genexpression<\/strong> bedeutet: Eine Zelle nutzt die Information eines Gens, um RNA und häufig über diese ein Protein herzustellen. <em>Wie stark und wann<\/em> ein Gen aktiv ist, hängt von der Regulation in der Zelle ab. <b>Dominant<\/b> und <b>rezessiv<\/b> beschreiben dagegen, wie Allele den Phänotyp bei bestimmten Genotypen beeinflussen. Das ist <strong>nicht dasselbe<\/strong> wie «Gen an» und «Gen aus».<\/p><div class=\"note\"><strong>Wichtig:<\/strong> Ein <b>Allel<\/b> ist eine <em>Variante eines Gens<\/em>, nicht «ein Gen mit mehreren Varianten». Die menschliche Augenfarbe ist zudem kein verlässliches Ein-Gen-Beispiel; für klare Kreuzungsschemata verwenden wir bewusst das vereinfachte Erbsenmodell.<\/div>"],"figure":"basics","recall":["Was ist der Unterschied zwischen einem Gen und einem Allel?","Ein Gen ist ein bestimmter DNA-Abschnitt. Ein Allel ist eine Variante dieses Gens."]},{"id":"fortpflanzung","title":"Sexuell und asexuell","tag":"Fortpflanzung","minutes":12,"summary":"Warum gibt es zwei Wege der Fortpflanzung – und welchen Vorteil hat welcher?","goals":["Sexuelle und asexuelle Fortpflanzung an Beispielen erklären","Je zwei Vorteile und Nachteile begründen","Vor- und Nachteile anhand einer Umweltänderung begründen"],"keys":["Asexuell = ohne Verschmelzung von Gameten","Sexuell = neue Kombinationen von Erbinformation","Variation erleichtert mögliche Anpassung"],"trap":"Asexuelle Nachkommen sind nicht zwangsläufig auf ewig genetisch identisch: Mutationen sind möglich.","intro_title":"Zwei Wege zu Nachkommen","intro":"Asexuell und sexuell unterscheiden sich vor allem darin, wie die Erbinformation weitergegeben und gemischt wird.","coach":"Nenn für beide Formen je einen Vorteil und einen Nachteil – am besten anhand eines konkreten Beispiels.","segments":["<p>Bei der <strong>asexuellen (ungeschlechtlichen)<\/strong> Fortpflanzung entsteht ein Nachkomme ohne Verschmelzung von Geschlechtszellen. Beispiele sind die Zweiteilung bei Bakterien, die Knospung bei Hefen oder das Vermehren einer Erdbeerpflanze über Ausläufer. Nachkommen sind in der Regel genetisch sehr ähnlich bzw. Klone; <strong>Mutationen<\/strong> können trotzdem Unterschiede bewirken.<\/p><p>Bei der <strong>sexuellen (geschlechtlichen)<\/strong> Fortpflanzung verschmelzen in typischen tierischen Beispielen zwei haploide Geschlechtszellen (Ei- und Samenzelle). Meiose und Befruchtung kombinieren Erbinformation neu. Die Nachkommen sind deshalb meist genetisch verschieden.<\/p><div class=\"compare\"><div><h4>Asexuell<\/h4><p><b>Plus:<\/b> oft schnell, kein Partner nötig, bewährter Genotyp bleibt erhalten.<\/p><p><b>Minus:<\/b> geringe genetische Vielfalt, dadurch bei Umweltänderungen teilweise anfälliger.<\/p><\/div><div><h4>Sexuell<\/h4><p><b>Plus:<\/b> neue Allelkombinationen, genetische Vielfalt, mögliche Anpassungsvorteile.<\/p><p><b>Minus:<\/b> häufig mehr Zeit und Energie nötig; Partnersuche und Bildung von Gameten.<\/p><\/div><\/div>","<div class=\"example\"><strong>Gedankenexperiment:<\/strong> Eine Pflanzenkrankheit tritt plötzlich auf. Besteht eine Population aus genetisch sehr ähnlichen Klonen, können alle ähnlich anfällig sein. Sind Pflanzen genetisch verschieden, besteht eine grössere Chance, dass einige widerstandsfähige Varianten dabei sind.<\/div><p><strong>Einordnung:<\/strong> „Sexuell ist immer besser“ stimmt nicht. Beide Strategien können je nach Lebensweise und Umwelt erfolgreich sein. Viele Organismen können sogar beide nutzen.<\/p><h3>Vorteile und Nachteile für einen Test erklären<\/h3><div class=\"studytable\"><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Situation<\/span><div class=\"studytable-value\"><strong>Partner<\/strong><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Asexuell<\/span><div class=\"studytable-value\">Kein Partner nötig<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Sexuell<\/span><div class=\"studytable-value\">Oft Partnersuche bzw. Begegnung der Gameten nötig<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Situation<\/span><div class=\"studytable-value\"><strong>Geschwindigkeit<\/strong><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Asexuell<\/span><div class=\"studytable-value\">Häufig schnell und ressourcensparend<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Sexuell<\/span><div class=\"studytable-value\">Oft aufwendiger durch Meiose, Gameten und Befruchtung<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Situation<\/span><div class=\"studytable-value\"><strong>Erbgut<\/strong><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Asexuell<\/span><div class=\"studytable-value\">Nachkommen meist Klone (abgesehen von Mutationen)<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Sexuell<\/span><div class=\"studytable-value\">Neu kombinierte Allele; hohe genetische Vielfalt möglich<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Situation<\/span><div class=\"studytable-value\"><strong>Veränderte Umwelt<\/strong><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Asexuell<\/span><div class=\"studytable-value\">Geringe Vielfalt kann nachteilig sein<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Sexuell<\/span><div class=\"studytable-value\">Unterschiedliche Varianten können Anpassung ermöglichen<\/div><\/div><\/div><\/div>","<div class=\"note\"><strong>Wichtig:<\/strong> Sexuelle Fortpflanzung setzt nicht immer «zwei verschiedene Geschlechter» oder Partnersuche voraus – es gibt auch zwittrige Arten und Selbstbefruchtung. Das ist in der Vorlage zu absolut formuliert.<\/div>"],"figure":"reproduction","recall":["Warum ist die genetische Vielfalt bei sexueller Fortpflanzung häufig grösser?","Weil bei der Meiose Erbinformation neu kombiniert wird und bei der Befruchtung zwei Gameten zusammenkommen."]},{"id":"chromosomen","title":"DNA, Chromosomen und Chromatiden","tag":"Aufbau","minutes":16,"summary":"Was ist ein Chromosom – und weshalb sieht es manchmal wie ein X aus?","goals":["DNA, Chromatin, Chromosom, Chromatid und Centromer erklären","Homologe Chromosomen von Schwesterchromatiden unterscheiden","Diploid/haploid und 1-/2-Chromatid-Zustände verstehen","Nukleosomen, Histone und Telomere erklären","Funktionen der Verpackung und der Chromosomen erläutern"],"keys":["DNA + Proteine = Chromatin","X = 2 Schwesterchromatiden + Centromer","Homolog ≠ Schwesterchromatiden","S-Phase: DNA-Menge ×2, Chromosomenzahl unverändert","Nukleosom = DNA um Histon-Oktamer","Telomere schützen Chromosomenenden"],"trap":"Ein X besteht aus einem einzigen verdoppelten Chromosom – nicht aus zwei homologen Chromosomen.","intro_title":"Was steckt in einem X?","intro":"Die X-Form wirkt wie zwei Chromosomen. Tatsächlich ist es ein verdoppeltes Chromosom mit zwei Schwesterchromatiden.","coach":"Unterscheide immer: Chromosom, Chromatid, homologes Paar.","segments":["<p>In eukaryotischen Zellen liegt die DNA meist als <strong>Chromatin<\/strong> (DNA mit Proteinen, insbesondere Histonen) im Zellkern vor. Vor einer Kernteilung wird sie stark verdichtet und als <strong>Chromosom<\/strong> gut sichtbar. Eine einzige menschliche Körperzelle besitzt normalerweise 46 Chromosomen, geordnet in 23 Paare.<\/p><div data-figure=\"chromosome\"><\/div><p>Ein <strong>1-Chromatid-Chromosom<\/strong> enthält ein Chromatid. In der <strong>S-Phase<\/strong> wird die DNA kopiert: Es entsteht ein <strong>2-Chromatid-Chromosom<\/strong> mit zwei am <strong>Centromer<\/strong> verbundenen Schwesterchromatiden. <em>Das Chromosom wird dabei nicht „zu zwei Chromosomen“ gezählt.<\/em> Erst wenn die Schwesterchromatiden getrennt sind, zählen sie als eigene Chromosomen.<\/p><p><strong>Homologe Chromosomen<\/strong> bilden ein Paar, beispielsweise das Chromosom 7 von der Mutter und das Chromosom 7 vom Vater. Sie tragen dieselben Gene an entsprechenden Orten, müssen aber nicht dieselben Allele besitzen. <strong>Schwesterchromatiden<\/strong> sind hingegen die Kopien <em>eines<\/em> Chromosoms nach der DNA-Replikation; sie sind zunächst praktisch identisch.<\/p>","<div class=\"compare\"><div><h4>Diploid (2n)<\/h4><p>Zwei Chromosomensätze, beim Menschen normalerweise 46 in Körperzellen (2n = 46).<\/p><\/div><div><h4>Haploid (n)<\/h4><p>Ein Chromosomensatz, bei menschlichen Geschlechtszellen normalerweise 23 (n = 23).<\/p><\/div><\/div><p><strong>Vorsicht:<\/strong> Bei der DNA-Verdopplung in der S-Phase verdoppelt sich die DNA-Menge, <em>nicht<\/em> die Chromosomenzahl. Bei einem Menschen bleibt die Zelle bis zum Trennen der Schwesterchromatiden bei 46 Chromosomen.<\/p><h3>Von der DNA zum sichtbaren Chromosom<\/h3><div class=\"timeline\"><div><b>1 · DNA<\/b><span>Langes Molekül aus miteinander verbundenen Nukleotiden. Die Basenabfolge speichert die Information.<\/span><\/div>\n<div><b>2 · Nukleosom<\/b><span>Die DNA wickelt sich um einen Kern aus <strong>acht Histon-Proteinen<\/strong>. Viele solcher «Spulen» folgen aufeinander.<\/span><\/div>\n<div><b>3 · Chromatin<\/b><span>Gesamtheit von DNA und zugehörigen Proteinen. Zwischen Teilungen meistens lockerer gepackt.<\/span><\/div>\n<div><b>4 · Kondensiertes Chromosom<\/b><span>Für Mitose/Meiose wird das Chromatin stark verdichtet und kann im Mikroskop deutlich erkennbar sein.<\/span><\/div><\/div>","<div class=\"compare\"><div><h4>Centromer<\/h4><p>Region des Chromosoms, an der Schwesterchromatiden verbunden sind und die Spindel über den Kinetochor angreifen kann.<\/p><\/div>\n<div><h4>Telomere<\/h4><p>Schutzstrukturen an den <strong>Enden<\/strong> linearer Chromosomen, damit die DNA-Enden nicht wie Bruchstellen behandelt werden.<\/p><\/div><\/div><div class=\"example\"><strong>Prüfungssituation:<\/strong> Im Bild siehst du ein X: <em>ein<\/em> 2-Chromatid-Chromosom, nicht zwei homologe Chromosomen. Im Zellzyklus kann dasselbe Chromosom als einzelner «Stab» oder als «X» dargestellt werden.<\/div>"],"figure":"chromosome","recall":["Was genau zeigt ein X-förmiges Chromosom?","Ein verdoppeltes Chromosom mit zwei Schwesterchromatiden, die am Centromer verbunden sind."]},{"id":"karyogramm","title":"Karyogramme lesen","tag":"Analyse","minutes":14,"summary":"Wie erkennt man Chromosomenpaare, XX/XY und Zahlenabweichungen?","goals":["Karyogramm definieren und Chromosomen ordnen","Normalen menschlichen Chromosomensatz erkennen","Trisomie 21 im schematischen Karyogramm zählen","Haploide und diploide Karyogramme vergleichen"],"keys":["23 Paare = 46 Chromosomen (typisch)","22 Autosomenpaare + Geschlechtschromosomen","47,XX,+21 = Trisomie 21"],"trap":"Das Karyogramm ist keine DNA-Sequenzanalyse. Kleine Genveränderungen sind darin meist unsichtbar.","intro_title":"Chromosomen lesen","intro":"Ein Karyogramm ordnet Chromosomen zu Paaren. Damit kann man die Anzahl und grössere Auffälligkeiten erkennen.","coach":"Übe die Schreibweisen 46,XX / 46,XY / 47,XX,+21 und erkläre sie laut.","segments":["<p>Ein <strong>Karyogramm<\/strong> ist die geordnete Darstellung der Chromosomen einer Zelle. Sie werden normalerweise nach Grösse, Bandenmuster und Lage des Centromers zu Paaren angeordnet. Die Chromosomen werden häufig in der Metaphase fotografiert, wenn sie stark verdichtet sind.<\/p><p>Beim Menschen findet man üblicherweise <strong>22 Autosomenpaare<\/strong> (Nummern 1 bis 22) und <strong>ein Paar Geschlechtschromosomen<\/strong>. Häufige Karyotypen sind 46,XX und 46,XY. Die Angabe beschreibt eine Chromosomenkonstellation, nicht sämtliche biologischen Eigenschaften oder die Geschlechtsidentität einer Person.<\/p><div data-figure=\"karyogram\"><\/div><p>Die Schreibweise <b>47,XX,+21<\/b> bedeutet: insgesamt 47 Chromosomen, XX-Konstellation und ein zusätzliches Chromosom 21. Das nennt man <strong>Trisomie 21<\/strong>. Eine Trisomie ist eine <em>zahlenmässige<\/em> Chromosomenabweichung, keine einzelne Genmutation.<\/p><div class=\"example\"><strong>Prüfungsfrage:<\/strong> «Ein Karyogramm zeigt drei Chromosomen Nr. 21. Was folgerst du?» – Eine Trisomie 21 liegt vor. Zähle immer zuerst die Paare und suche nach zusätzlichen oder fehlenden Chromosomen.<\/div>","<p><strong>Grenzen:<\/strong> Ein Karyogramm zeigt grössere Chromosomenabweichungen; kleine Veränderungen in der DNA-Sequenz lassen sich damit in der Regel nicht erkennen.<\/p><h3>Haploid und diploid im Karyogramm<\/h3><p><b>2n = 46:<\/b> 23 Paare in einer üblichen menschlichen Körperzelle. Ein homologes Paar besteht grundsätzlich aus je einem Chromosom mütterlicher und väterlicher Herkunft. Die beiden tragen dieselben Genorte, können sich aber in ihren <b>Allelen<\/b> unterscheiden.<\/p><p><b>n = 23:<\/b> ein einfacher Satz in einer typischen menschlichen Eizelle oder einem Spermium. Der Satz enthält Chromosomen mit unterschiedlichen mütterlichen und väterlichen Abschnitten – durch Rekombination sind das nicht einfach «nur alle Mutter-» oder «nur alle Vaterchromosomen».<\/p><div class=\"example\"><strong>So gehst du vor:<\/strong> (1) Alle Chromosomen zählen, (2) homologe Paare anhand Grösse/Bandenmuster/Centromer suchen, (3) die Geschlechtschromosomen prüfen, (4) zusätzliche oder fehlende Exemplare benennen.<\/div>"],"figure":"karyogram","recall":["Was liest du aus der Schreibweise 47,XX,+21?","47 Chromosomen, XX-Konstellation, drei Exemplare von Chromosom 21 (Trisomie 21)."]},{"id":"zellzyklus","title":"Zellzyklus","tag":"Abläufe","minutes":13,"summary":"Was macht die Zelle vor der Teilung – und wann wird die DNA kopiert?","goals":["G₁, S, G₂, M und Cytokinese in korrekter Reihenfolge nennen","Erklären, was in der S-Phase passiert","Interphase und Mitose unterscheiden","G₀ und die Bedeutung der Kontrollpunkte erklären"],"keys":["Reihenfolge: G₁ → S → G₂ → M","Interphase = G₁ + S + G₂","S steht für DNA-Synthese","Mitose und Cytokinese sind nicht synonym","G₁-Kontrollpunkt: Weiterteilen oder G₀"],"trap":"Die DNA wird in der S-Phase und nicht während der Mitose verdoppelt.","intro_title":"Wann passiert was?","intro":"G₁, S und G₂ sind die Vorbereitung. In der S-Phase wird die DNA verdoppelt, nicht die Chromosomenzahl.","coach":"Wenn du die Abfolge erklären kannst, verstehst du Mitose und Meiose leichter.","segments":["<p>Der <strong>Zellzyklus<\/strong> umfasst das Wachstum, die Vorbereitung und die Teilung einer Zelle. Eine typische teilungsfähige Körperzelle durchläuft <strong>G₁ → S → G₂ → M<\/strong>. Darauf folgen wieder G₁ oder ein Ruhestadium (G₀).<\/p><div data-figure=\"cycle\"><\/div><div class=\"timeline\"><div><b>G₁-Phase<\/b><span>Wachstum, Stoffwechsel, Vorbereitung.<\/span><\/div><div><b>S-Phase<\/b><span>DNA wird verdoppelt; jedes Chromosom hat danach zwei Schwesterchromatiden.<\/span><\/div><div><b>G₂-Phase<\/b><span>Weiteres Wachstum, Kontrolle und Vorbereitung der Kernteilung.<\/span><\/div><div><b>M-Phase<\/b><span>Mitose = Kernteilung; Cytokinese = Teilung des Zellplasmas.<\/span><\/div><\/div><p><strong>Interphase<\/strong> heisst die Zeit von G₁ über S bis G₂. Sie ist kein Leerlauf, sondern eine sehr aktive Zeit. Im Zellzyklus gibt es Kontrollpunkte, an denen die Zelle prüft, ob sie fortfahren soll.<\/p><div class=\"example\"><strong>Zahlenbeispiel Mensch:<\/strong> Vor der S-Phase: 46 Chromosomen mit je einem Chromatid. Nach der S-Phase: weiterhin 46 Chromosomen, jetzt mit je zwei Schwesterchromatiden – also 92 Chromatiden. Das ist nicht dasselbe wie 92 Chromosomen.<\/div>","<h3>Die Kontrollpunkte und G₀ verstehen<\/h3><div class=\"timeline\"><div><b>G₁ · Wachstumsphase<\/b><span>Zelle wächst, bildet Zellbestandteile, führt ihre Aufgaben aus. Am Kontrollpunkt wird entschieden, ob sie sich weiter teilt oder in <strong>G₀<\/strong> übergeht.<\/span><\/div>\n<div><b>S · Synthesephase<\/b><span><strong>Replikation<\/strong> der DNA. Aus jedem 1-Chromatid-Chromosom wird ein 2-Chromatid-Chromosom, die Chromosomenzahl bleibt zunächst gleich.<\/span><\/div>\n<div><b>G₂ · Vorbereitung<\/b><span>Wachstum und Kontrolle, ob die DNA vollständig und hinreichend fehlerfrei kopiert wurde.<\/span><\/div>\n<div><b>M · Mitotische Phase<\/b><span>Mitose (Kernteilung) und üblicherweise Cytokinese (Teilung des Zellplasmas).<\/span><\/div><\/div><p>Die <strong>Interphase<\/strong> umfasst G₁ + S + G₂ und nimmt bei vielen Zellen den grössten Teil des Zellzyklus ein. G₀ ist eine Ruhe- beziehungsweise Differenzierungsphase ausserhalb des aktiven Teilungszyklus.<\/p>"],"figure":"cycle","recall":["Was verändert sich in der S-Phase – und was nicht?","Die DNA-Menge verdoppelt sich. Die Chromosomenzahl bleibt gleich."]},{"id":"mitose","title":"Mitose verstehen","tag":"Zellteilung","minutes":17,"summary":"Wie entstehen aus einer Körperzelle zwei genetisch weitgehend gleiche Zellen?","goals":["Phasen in korrekter Reihenfolge beschreiben","Chromosomenbewegungen erklären","Mitose-Ergebnis korrekt angeben","Nucleolus, Kernhülle und Spindelapparat den Phasen zuordnen","Mitosebilder anhand charakteristischer Strukturen erkennen"],"keys":["Mitose: 1 Kernteilung, dann meist Cytokinese","Trennung der Schwesterchromatiden in der Anaphase","Ergebnis: 2 genetisch weitgehend gleiche Zellen","Anaphase: Ein-Chromatid-Chromosomen wandern zu Polen"],"trap":"Bei der Mitose werden Schwesterchromatiden getrennt, nicht die homologen Chromosomen als Paare wie in der Meiose I.","intro_title":"Aus einer werden zwei","intro":"Bei der Mitose werden die Schwesterchromatiden getrennt. Am Schluss entstehen in unserem Grundmodell zwei nahezu identische Tochterzellen.","coach":"Übe zuerst die Reihenfolge; erst dann die Details jeder Phase.","segments":["<p>Die <strong>Mitose<\/strong> ist die Teilung des Zellkerns. Sie ist wichtig für Wachstum, Erneuerung und Reparatur. Vorausgesetzt wird die DNA-Verdopplung während der S-Phase. Anschliessend wird eine vollständige Chromosomenausstattung auf zwei neue Zellkerne verteilt.<\/p><div data-figure=\"mitosis\"><\/div><p>Häufig lernt man vier Hauptphasen: <b>Prophase → Metaphase → Anaphase → Telophase<\/b>. In ausführlicheren Darstellungen wird zwischen Prophase und Metaphase eine <b>Prometaphase<\/b> beschrieben, in der die Kernhülle zerfällt und Spindelfasern an die Chromosomen binden.<\/p><div class=\"timeline\"><div><b>Prophase<\/b><span>Chromosomen kondensieren; der Spindelapparat bildet sich.<\/span><\/div><div><b>Metaphase<\/b><span>Verdoppelte Chromosomen ordnen sich einzeln in der Äquatorialebene an.<\/span><\/div><div><b>Anaphase<\/b><span>Schwesterchromatiden trennen sich und wandern zu entgegengesetzten Polen.<\/span><\/div><div><b>Telophase<\/b><span>Neue Kernhüllen bilden sich; Chromosomen entspiralisieren sich.<\/span><\/div><div><b>Cytokinese<\/b><span>Das Zellplasma wird auf zwei Tochterzellen verteilt.<\/span><\/div><\/div>","<p>Das Ergebnis der vollständigen Zellteilung ist in einem typischen diploiden Modell <strong>2 diploide Tochterzellen<\/strong> mit demselben Chromosomensatz wie die Ausgangszelle und – abgesehen von möglichen Veränderungen – derselben Erbinformation.<\/p><div class=\"example\"><strong>Vorstellungshilfe:<\/strong> Stell dir vor, du hast ein vollständiges Buchregal. Zuerst wird jedes Buch kopiert (S-Phase). Dann werden die beiden Kopien getrennt und zu zwei vollständigen Regalen verteilt (Mitose).<\/div><h3>Mitose-Phasen mit allen Prüfungsdetails<\/h3>","<div class=\"studytable\"><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Prophase<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was genau passiert?<\/span><div class=\"studytable-value\">Chromatin verdichtet sich zu Chromosomen. Spindelapparat bildet sich. Nucleolus verschwindet; Kernhülle wird zum Ende der Prophase bzw. in der Prometaphase abgebaut.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Erkennen<\/span><div class=\"studytable-value\">Gut sichtbare, verdoppelte Chromosomen<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Metaphase<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was genau passiert?<\/span><div class=\"studytable-value\">Chromosomen liegen <b>einzeln<\/b> an der Äquatorialebene. Spindelfasern verbinden sich über Kinetochoren mit den Centromerregionen.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Erkennen<\/span><div class=\"studytable-value\">Eine Reihe verdoppelter Chromosomen in der Zellmitte<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Anaphase<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was genau passiert?<\/span><div class=\"studytable-value\">Die <b>Schwesterchromatiden<\/b> werden getrennt. Danach zählen sie als eigene Ein-Chromatid-Chromosomen und wandern zu entgegengesetzten Polen.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Erkennen<\/span><div class=\"studytable-value\">Zwei auseinanderwandernde Gruppen<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Telophase<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was genau passiert?<\/span><div class=\"studytable-value\">Chromosomen lockern sich, neue Kernhüllen und Nucleoli können entstehen, Spindel wird abgebaut.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Erkennen<\/span><div class=\"studytable-value\">Zwei sich bildende Zellkerne<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Cytokinese<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was genau passiert?<\/span><div class=\"studytable-value\">Teilung des Cytoplasmas. Tierzellen schnüren sich ein; Pflanzen bilden eine Zellplatte.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Erkennen<\/span><div class=\"studytable-value\">Zwei getrennte Tochterzellen<\/div><\/div><\/div><\/div>","<div class=\"note\"><strong>Fachbegriff:<\/strong> Das heisst korrekt <strong>Ein-Chromatid-Chromosomen<\/strong>. Zwei Tochterzellen besitzen nach der Mitose im Normalfall denselben diploiden Chromosomensatz und nahezu dieselbe Erbinformation.<\/div>"],"figure":"mitosis","recall":["Was wird in der Anaphase getrennt?","Die Schwesterchromatiden eines verdoppelten Chromosoms werden getrennt und zu entgegengesetzten Zellpolen gezogen."]},{"id":"meiose","title":"Meiose Schritt für Schritt","tag":"Zellteilung","minutes":21,"summary":"Wie werden aus einer diploiden Zelle vier haploide Zellen?","goals":["Meiose I und Meiose II unterscheiden","Homologe Chromosomen und Chromatiden korrekt zuordnen","Chromosomensatz und Variation erklären","Alle acht Kernteilungsphasen und beide Cytokinesen beschreiben","Meiose I/II anhand von Abbildungen unterscheiden"],"keys":["DNA-Replikation nur einmal vor Meiose I","I: homologe Chromosomen getrennt","II: Schwesterchromatiden getrennt","Ergebnis im Modell: 4 haploide, unterschiedliche Zellen","Metaphase I: homologe Paare nebeneinander","Metaphase II: Chromosomen einzeln"],"trap":"Die DNA wird zwischen Meiose I und Meiose II nicht erneut verdoppelt.","intro_title":"Zwei Teilungen, vier Zellen","intro":"Meiose besteht aus zwei Teilungen. In der ersten werden die homologen Paare getrennt, in der zweiten die Schwesterchromatiden.","coach":"Das ist ein grosses Prüfungsthema. Schau dir die Zeichnung mehrfach an, bis du den Ablauf ohne Text erklären kannst.","segments":["<p>Die <strong>Meiose<\/strong> ist eine besondere Zellkernteilung bei der geschlechtlichen Fortpflanzung. Nach <em>einer<\/em> DNA-Verdopplung folgen <strong>zwei Teilungen<\/strong>. Dadurch wird der Chromosomensatz halbiert. Im üblichen Schulmodell entstehen daraus <strong>vier haploide, genetisch unterschiedliche Zellen<\/strong>. Bei der menschlichen Eizellbildung verteilt sich das Zellplasma ungleich: Es entsteht nur eine grosse funktionsfähige Eizelle und kleinere Polkörperchen.<\/p><div data-figure=\"meiosis\"><\/div><p><strong>Meiose I = Reduktionsteilung.<\/strong> Homologe Chromosomen paaren sich in der Prophase I. Dort kann es zum Crossing-over kommen. In der Metaphase I ordnen sich die homologen Paare an; in der <b>Anaphase I werden homologe Chromosomen voneinander getrennt<\/b>. Die Schwesterchromatiden bleiben zunächst zusammen. Nach Meiose I haben die Zellen einen haploiden Satz, aber die Chromosomen bestehen weiterhin aus zwei Chromatiden.<\/p>","<p><strong>Meiose II = Äquationsteilung.<\/strong> Ohne erneute DNA-Verdopplung ordnen sich die Chromosomen erneut an. Erst in der <b>Anaphase II werden Schwesterchromatiden getrennt<\/b>. Nach der anschliessenden Zellteilung liegen normalerweise vier haploide Zellen vor.<\/p><div class=\"compare\"><div><h4>Meiose I<\/h4><p>Trennung homologer Chromosomen; 2n → n. Crossing-over geschieht zuvor in Prophase I.<\/p><\/div><div><h4>Meiose II<\/h4><p>Trennung der Schwesterchromatiden; n bleibt n.<\/p><\/div><\/div><div class=\"example\"><strong>Chromosomenzahlen beim Menschen:<\/strong> Ausgangszelle 2n = 46. Nach der DNA-Verdopplung immer noch 46 Chromosomen mit je zwei Chromatiden. Nach Meiose I: 23 2-Chromatid-Chromosomen pro Zelle. Nach Meiose II: 23 1-Chromatid-Chromosomen pro Zelle.<\/div><p><strong>Merksatz:<\/strong> I trennt <em>Paare<\/em>, II trennt <em>Kopien<\/em>.<\/p>","<h3>Alle Phasen der Meiose I: Reduktionsteilung<\/h3><div class=\"studytable\"><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Prophase I<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Das geschieht<\/span><div class=\"studytable-value\">Chromosomen kondensieren; <strong>homologe Chromosomen paaren sich<\/strong> (Synapsis). Crossing-over zwischen Nicht-Schwesterchromatiden ist möglich. Spindel bildet sich, Kernhülle wird abgebaut.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Metaphase I<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Das geschieht<\/span><div class=\"studytable-value\"><strong>Homologe Paare<\/strong> ordnen sich gemeinsam an der Äquatorialebene an – zufällig mit Blick auf die beiden Zellpole.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Anaphase I<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Das geschieht<\/span><div class=\"studytable-value\">Die <strong>homologen Chromosomen<\/strong> werden voneinander getrennt. Die Schwesterchromatiden bleiben zusammen.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Telophase I / Cytokinese I<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Das geschieht<\/span><div class=\"studytable-value\">Zwei <strong>haploide<\/strong> Zellen entstehen; die Chromosomen haben nach wie vor <strong>zwei Chromatiden<\/strong>. Die Kernhülle kann sich – je nach Organismus – vorübergehend neu bilden.<\/div><\/div><\/div><\/div>","<h3>Alle Phasen der Meiose II: Äquationsteilung<\/h3><div class=\"studytable\"><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Prophase II<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Das geschieht<\/span><div class=\"studytable-value\">Die Chromosomen kondensieren, ein neuer Spindelapparat bildet sich, eine vorhandene Kernhülle löst sich auf.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Metaphase II<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Das geschieht<\/span><div class=\"studytable-value\">Chromosomen liegen <strong>einzeln<\/strong> in der Äquatorialebene – ohne ihren homologen Partner aus Meiose I.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Anaphase II<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Das geschieht<\/span><div class=\"studytable-value\">Die <strong>Schwesterchromatiden<\/strong> werden getrennt und bewegen sich als Ein-Chromatid-Chromosomen zu den Polen.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Phase<\/span><div class=\"studytable-value\"><b>Telophase II / Cytokinese II<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Das geschieht<\/span><div class=\"studytable-value\">Neue Kerne und Zellgrenzen bilden sich. Im üblichen Schulmodell entstehen vier genetisch unterschiedliche, <b>haploide<\/b> Zellen.<\/div><\/div><\/div><\/div><div class=\"example\"><strong>Unterscheidungsaufgabe:<\/strong> Siehst du <b>Paare<\/b> an der Äquatorialebene, ist es Metaphase <b>I<\/b>. Siehst du <b>einzelne Chromosomen<\/b> in haploiden Zellen, ist es Metaphase <b>II<\/b>. Trennen sich <b>homologe<\/b> Chromosomen, ist es Anaphase <b>I<\/b>; trennen sich <b>Schwesterchromatiden<\/b>, ist es Anaphase <b>II<\/b>.<\/div>","<div class=\"note\"><strong>Genauigkeit:<\/strong> Kernhüllen/Nucleoli werden nicht bei allen Organismen in jeder meiotischen Zwischenphase vollständig neu aufgebaut. Für die Prüfung ist vor allem entscheidend, <b>welche Chromosomenstrukturen wann getrennt werden<\/b>.<\/div>"],"figure":"meiosis","recall":["Was ist der Unterschied zwischen Anaphase I und Anaphase II?","In Anaphase I trennen sich homologe Chromosomen. In Anaphase II trennen sich Schwesterchromatiden."]},{"id":"variabilitaet","title":"Genetische Variabilität","tag":"Verständnis","minutes":18,"summary":"Warum sind Geschwister genetisch nicht identisch?","goals":["Interchromosomale und intrachromosomale Rekombination unterscheiden","Crossing-over genau lokalisieren","Mutation, Meiose und zufällige Befruchtung trennen","Kreuzungsbeispiel AB/ab → Ab/aB erklären"],"keys":["Interchromosomal = ganze Chromosomen neu verteilen","Intrachromosomal = Crossing-over von DNA-Abschnitten","Prophase I: Crossing-over","Mutation schafft neue Varianten; Rekombination mischt sie"],"trap":"Crossing-over geschieht normalerweise zwischen Nicht-Schwesterchromatiden homologer Chromosomen – nicht zwischen zwei Schwesterchromatiden.","intro_title":"Warum Geschwister verschieden sind","intro":"Genetische Unterschiede entstehen unter anderem dadurch, dass bei der Meiose ganze Chromosomen neu verteilt und Stücke ausgetauscht werden.","coach":"Lern den Unterschied: interchromosomal = ganze Chromosomen; intrachromosomal = Stückaustausch.","segments":["<p><strong>Genetische Variabilität<\/strong> bedeutet, dass Individuen unterschiedliche genetische Ausstattung besitzen können. Bei sexueller Fortpflanzung entstehen neue Kombinationen bereits vorhandener Allele. Drei Vorgänge sind besonders wichtig:<\/p><div class=\"timeline\"><div><b>1 · Unabhängige Verteilung<\/b><span>In der Metaphase I werden homologe Chromosomenpaare zufällig ausgerichtet. Verschiedene mütterliche und väterliche Chromosomen werden neu kombiniert: interchromosomale Rekombination.<\/span><\/div><div><b>2 · Crossing-over<\/b><span>Während der Prophase I tauschen <strong>Nicht-Schwesterchromatiden<\/strong> homologer Chromosomen entsprechende DNA-Abschnitte aus: intrachromosomale Rekombination.<\/span><\/div><div><b>3 · Zufällige Befruchtung<\/b><span>Welche Eizelle und welches Spermium verschmelzen, ist eine weitere Quelle neuer Kombinationen.<\/span><\/div><\/div><div data-figure=\"crossing\"><\/div><div class=\"example\"><strong>Wie gross ist der Effekt?<\/strong> Nur durch die zufällige Verteilung der 23 Chromosomenpaare sind beim Menschen 2²³ = 8'388'608 grundsätzliche Kombinationen pro Gamete möglich – <em>ohne<\/em> Crossing-over. Durch Crossing-over gibt es zusätzlich eine enorme Zahl möglicher Kombinationen.<\/div>","<p><strong>Mutation versus Rekombination:<\/strong> Mutation verändert die DNA-Sequenz und kann <em>neue<\/em> Allele erzeugen. Rekombination <em>mischt vorhandene<\/em> Allele auf neue Weise. Veränderungen der DNA können bei beiden Fortpflanzungsformen entstehen.<\/p><h3>Zwei Formen der Rekombination direkt vergleichen<\/h3><div class=\"compare\"><div><h4>Interchromosomal<\/h4><p><b>Metaphase I / Anaphase I:<\/b> die mütterlichen und väterlichen <b>ganzen Chromosomen<\/b> werden bei der ersten Reifeteilung zufällig auf die Zellen verteilt.<\/p><p>Beispiel mit zwei Paaren: M₁/M₂, M₁/V₂, V₁/M₂, V₁/V₂ (vier mögliche Grundkombinationen).<\/p><\/div><div><h4>Intrachromosomal<\/h4><p><b>Prophase I:<\/b> Nicht-Schwesterchromatiden <b>homologer<\/b> Chromosomen tauschen passende Abschnitte aus.<\/p><p>Beispiel mit zwei Genorten auf demselben Chromosom: Vorher <b>AB<\/b> und <b>ab<\/b>; nach Crossing-over können auch <b>Ab<\/b> und <b>aB<\/b> entstehen.<\/p><\/div><\/div><p><strong>Wichtig:<\/strong> Beim Crossing-over tauschen Chromatiden DNA-Stücke – nicht gezielt «Augenfarbe gegen Augenfarbe». Die neu kombinierten Allele können sich auf den Phänotyp auswirken; solche Merkmale werden aber bei Menschen häufig von vielen Genen bestimmt.<\/p>"],"figure":"crossing","recall":["Erkläre den Unterschied zwischen inter- und intrachromosomaler Rekombination.","Interchromosomal: ganze Chromosomen werden zufällig verteilt. Intrachromosomal: DNA-Abschnitte werden durch Crossing-over ausgetauscht."]},{"id":"mendelversuche","title":"Mendels Erbsenversuche","tag":"Vererbung","minutes":16,"summary":"Wie kam Gregor Mendel auf seine Regeln?","goals":["P, F₁ und F₂ benennen","Mendels Vorgehen nachzeichnen","Dominant und rezessiv aus einem Versuch erschliessen","Fünf Versuchsschritte begründen und Folgen beim Weglassen erklären"],"keys":["P = Eltern; F₁ = erste; F₂ = zweite Tochtergeneration","AA × aa → alle Aa","Aa × Aa → 1 AA : 2 Aa : 1 aa","Dominanter Phänotyp bei F₂ 3/4","Staubblätter entfernen → Selbstbestäubung verhindern","Blüten umhüllen → Fremdpollen fernhalten"],"trap":"Mendel beobachtete statistische Verhältnisse. Kleine Stichproben müssen nicht exakt 3:1 ergeben.","intro_title":"Was Mendel gemacht hat","intro":"Mendel hat seine Erbsenversuche so angelegt, dass er wusste, welche Pflanzen er kreuzt. Jeder Versuchsschritt hat einen Grund.","coach":"Für den Test musst du vermutlich nicht nur den Ablauf kennen, sondern auch sagen können, wozu jeder Schritt gut war.","segments":["<p><strong>Gregor Mendel<\/strong> untersuchte im 19. Jahrhundert Erbsenpflanzen. Für seine Versuche wählte er Merkmale mit klar unterscheidbaren Ausprägungen, etwa violette und weisse Blüten. Er arbeitete mit <strong>reinerbigen (homozygoten)<\/strong> Ausgangslinien und kontrollierte, welche Pflanzen miteinander gekreuzt wurden.<\/p><div data-figure=\"mendel\"><\/div><div class=\"timeline\"><div><b>Elterngeneration (P)<\/b><span>Reinerbig violett (AA) × reinerbig weiss (aa).<\/span><\/div><div><b>Erste Tochtergeneration (F₁)<\/b><span>Alle Nachkommen Aa. Alle erscheinen violett – Uniformität.<\/span><\/div><div><b>F₁-Kreuzung<\/b><span>Aa × Aa: Beide Eltern bilden Gameten mit A oder a.<\/span><\/div><div><b>Zweite Tochtergeneration (F₂)<\/b><span>Genotypen AA, Aa, Aa, aa. Genotyp-Verhältnis 1:2:1, Phänotyp-Verhältnis 3 violett : 1 weiss.<\/span><\/div><\/div><p>Warum taucht die weisse Blütenfarbe in F₂ wieder auf? Das rezessive Allel <b>a<\/b> ist in F₁ weiterhin vorhanden, wird aber vom dominanten Allel <b>A<\/b> im Phänotyp überdeckt. Wenn ein Nachkomme <b>aa<\/b> erhält, wird weiss sichtbar.<\/p><div class=\"example\"><strong>Wichtig:<\/strong> Die Verhältnisse 3:1 und 1:2:1 sind <em>statistische Erwartungen<\/em> bei vielen Nachkommen. Bei vier Samen müssen nicht zwingend genau drei violett und einer weiss sein.<\/div>","<h3>Mendels Versuchsablauf – und weshalb jeder Schritt nötig war<\/h3><div class=\"studytable\"><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Schritt<\/span><div class=\"studytable-value\"><b>1<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was tat Mendel?<\/span><div class=\"studytable-value\">Er wählte über Generationen <strong>reinerbige<\/strong> Erbsenlinien.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Warum?<\/span><div class=\"studytable-value\">Damit die Ausgangsgenotypen für das Merkmal verlässlich waren.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Schritt<\/span><div class=\"studytable-value\"><b>2<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was tat Mendel?<\/span><div class=\"studytable-value\">Er entfernte die <strong>Staubblätter<\/strong> der Empfängerblüte, bevor sie sich selbst bestäuben konnte.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Warum?<\/span><div class=\"studytable-value\">Um Selbstbestäubung zu verhindern.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Schritt<\/span><div class=\"studytable-value\"><b>3<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was tat Mendel?<\/span><div class=\"studytable-value\">Er übertrug <strong>Pollen<\/strong> einer gewählten Linie auf die Narbe der anderen.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Warum?<\/span><div class=\"studytable-value\">Um eine gezielte Kreuzung bzw. Fremdbestäubung auszulösen.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Schritt<\/span><div class=\"studytable-value\"><b>4<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was tat Mendel?<\/span><div class=\"studytable-value\">Er <strong>schützte/umhüllte<\/strong> die Blüten.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Warum?<\/span><div class=\"studytable-value\">Damit kein unerwünschter fremder Pollen die Kreuzung verfälschte.<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\">Schritt<\/span><div class=\"studytable-value\"><b>5<\/b><\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Was tat Mendel?<\/span><div class=\"studytable-value\">Er säte die Samen aus, beobachtete die <strong>F₁<\/strong> und kreuzte Nachkommen weiter zur <strong>F₂<\/strong>.<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">Warum?<\/span><div class=\"studytable-value\">Um die Merkmalsverteilung über Generationen zu überprüfen und zu zählen.<\/div><\/div><\/div><\/div><div class=\"example\"><strong>Typische Prüfungsfrage:<\/strong> «Was passiert, wenn Mendel die Staubblätter nicht entfernt?» → Dann ist Selbstbestäubung möglich; man könnte nicht sicher sein, welcher Pollen das Ergebnis verursacht hat.<\/div>"],"figure":"mendelstory","recall":["Weshalb hat Mendel die Staubblätter entfernt?","Er wollte Selbstbestäubung verhindern und gezielt bestimmen, welche Pflanzen er miteinander kreuzt."]},{"id":"mendelregeln","title":"Mendels 1. und 2. Regel","tag":"Vererbung","minutes":20,"summary":"Uniformität und Spaltung verstehen und berechnen.","goals":["1. Mendel-Regel an einem Beispiel erklären","2. Mendel-Regel mit Kreuzungsschema lösen","Genotyp- und Phänotyp-Verhältnis sicher unterscheiden","Intermediären Erbgang mit Kreuzungsschema erklären","Dominant-rezessive und intermediäre F₂-Phänotypen unterscheiden"],"keys":["1. Regel: F₁ ist uniform","2. Regel: F₂ spaltet auf","Aa × Aa: 25 % AA, 50 % Aa, 25 % aa","Phänotyp bei voller Dominanz: 3:1","Intermediär: F₁ Zwischenform, F₂ 1:2:1 auch im Phänotyp"],"trap":"3:1 ist das Phänotyp-Verhältnis, nicht das Genotyp-Verhältnis. Mendels 3. Regel heisst Unabhängigkeitsregel.","intro_title":"Kreuzen und verstehen","intro":"Bei Mendel geht es nicht nur ums Verhältnis 3:1. Wichtig ist, ob du Genotyp und Phänotyp unterscheiden und ein Kreuzungsschema selbst aufstellen kannst.","coach":"Mach die Kreuzungsschemata mit verschiedenen Elternkombinationen. Schau erst danach auf die Lösung.","segments":["<p><strong>1. Mendel'sche Regel – Uniformitätsregel:<\/strong> Kreuzt man zwei reinerbige Individuen, die sich in einem Merkmal unterscheiden, sind die Nachkommen der F₁-Generation in diesem Merkmal untereinander gleich (uniform). Bei einem vollständig dominant-rezessiven Erbgang zeigt die F₁ den dominanten Phänotyp.<\/p><p><strong>Beispiel:<\/strong> AA × aa → sämtliche F₁-Nachkommen Aa → alle violett.<\/p><p><strong>2. Mendel'sche Regel – Spaltungsregel:<\/strong> Kreuzt man die heterozygoten F₁-Individuen untereinander, spalten sich die Ausprägungen in der F₂-Generation in bestimmten Zahlenverhältnissen auf. Beim einfachen vollständig dominant-rezessiven Erbgang: <b>Genotyp 1:2:1<\/b>, <b>Phänotyp 3:1<\/b>.<\/p><div data-figure=\"punnett\"><\/div><div class=\"example\"><strong>So löst du eine Kreuzungsaufgabe:<\/strong> (1) Allele festlegen (A dominant, a rezessiv). (2) Genotypen der Eltern notieren. (3) Mögliche Gameten je Elternteil bestimmen. (4) 2×2-Schema ausfüllen. (5) Genotypen und Phänotypen zählen und Wahrscheinlichkeiten angeben.<\/div><p><strong>Beispiel Aa × aa:<\/strong> Nachkommen: 50 % Aa (violett), 50 % aa (weiss). <em>Nicht jede Kreuzung führt zum Verhältnis 3:1.<\/em><\/p>","<div class=\"note\"><strong>Ausblick:<\/strong> Die unabhängige Verteilung verschiedener Gene wird üblicherweise als <strong>3. Mendel'sche Regel<\/strong> bezeichnet. Sie gilt nicht uneingeschränkt für eng gekoppelte Gene. Hier konzentrieren wir uns auf die erste und zweite Regel.<\/div><p><strong>Grenzen:<\/strong> Diese einfachen Zahlenverhältnisse gelten für die entsprechenden Modellannahmen (z. B. vollständige Dominanz, keine speziellen Wechselwirkungen). Intermediäre und kodominante Erbgänge können beim Phänotyp andere Verhältnisse zeigen.<\/p>","<h3>Intermediärer Erbgang: F₁ ist rosa, F₂ zeigt 1 : 2 : 1<\/h3><p>Bei <strong>intermediärer Vererbung<\/strong> setzt sich kein Allel vollständig durch. Die Mischform (<strong>heterozygot<\/strong>) liegt zwischen den beiden reinerbigen Ausprägungen. Ein klassisches Schulbeispiel: rot <b>RR<\/b> × weiss <b>WW<\/b> → alle <b>RW<\/b> (rosa). Das ist ebenfalls die <b>Uniformitätsregel<\/b>.<\/p><div aria-label=\"Kreuzungsschema bei intermediärer Vererbung: RW mal RW ergibt RR rot, RW rosa, RW rosa und WW weiss.\" class=\"diagram\" role=\"img\">\n<div class=\"diagram-top\"><span class=\"diagram-title\">Kreuzung RW × RW · intermediär<\/span><\/div>\n<div class=\"studytable\"><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\"><\/span><div class=\"studytable-value\">R<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">R<\/span><div class=\"studytable-value\"><b>RR<\/b><br/>rot<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">W<\/span><div class=\"studytable-value\"><b>RW<\/b><br/>rosa<\/div><\/div><\/div><div class=\"studytable-row\"><div class=\"studytable-field\"><span class=\"studytable-label\"><\/span><div class=\"studytable-value\">W<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">R<\/span><div class=\"studytable-value\"><b>RW<\/b><br/>rosa<\/div><\/div><div class=\"studytable-field\"><span class=\"studytable-label\">W<\/span><div class=\"studytable-value\"><b>WW<\/b><br/>weiss<\/div><\/div><\/div><\/div>\n<p class=\"caption\">Genotyp F₂: 1 RR : 2 RW : 1 WW. Phänotyp F₂: <strong>1 rot : 2 rosa : 1 weiss<\/strong>.<\/p><\/div><div class=\"compare\"><div><h4>Vollständige Dominanz<\/h4><p>P: AA (gelb) × aa (grün)<\/p><p>F₁: alle Aa (gelb)<\/p><p>F₂: <b>3 gelb : 1 grün<\/b><\/p><\/div><div><h4>Intermediäre Vererbung<\/h4><p>P: RR (rot) × WW (weiss)<\/p><p>F₁: alle RW (rosa)<\/p><p>F₂: <b>1 rot : 2 rosa : 1 weiss<\/b><\/p><\/div><\/div><div class=\"note\"><strong>Unbedingt unterscheiden:<\/strong> Bei Aa × Aa ist das <b>Genotypverhältnis<\/b> immer 1:2:1 (im einfachen Modell). Beim <b>Phänotypverhältnis<\/b> hängt es davon ab, ob vollständige Dominanz (3:1) oder ein intermediärer Erbgang (1:2:1) vorliegt.<\/div>"],"figure":"punnett","recall":["Warum sind bei Aa × Aa die Verhältnisse 1:2:1 und 3:1 beide richtig?","1 AA : 2 Aa : 1 aa ist das Genotypverhältnis. Bei vollständiger Dominanz ergibt das 3 dominante : 1 rezessive Ausprägung (Phänotyp)."]}],"questions":[{"ch":"grundlagen","q":"Was untersucht die Genetik?","opts":["Nur die Organe eines Körpers","Vererbung und Veränderungen von Erbinformation","Nur die Befruchtung","Die Photosynthese"],"ans":1,"why":"Die Genetik beschäftigt sich mit Vererbung und genetischer Variation.","level":1,"type":"choice"},{"ch":"grundlagen","q":"Was ist ein Allel?","opts":["Eine Variante eines Gens","Ein ganzer Zellkern","Ein einzelnes Chromosomenpaar","Ein Protein im Zellplasma"],"ans":0,"why":"Allele sind alternative Varianten desselben Gens.","level":1,"type":"choice"},{"ch":"grundlagen","q":"Was bezeichnet der Genotyp?","opts":["Die äussere Farbe allein","Die Umweltbedingungen","Die genetische Allelkombination","Die Zahl der Kinder"],"ans":2,"why":"Beispiel: Aa ist ein Genotyp; violett ist der dazugehörige Phänotyp.","level":1,"type":"choice"},{"ch":"grundlagen","q":"Was ist der Phänotyp?","opts":["Der sichtbare oder messbare Merkmalszustand","Nur die DNA-Sequenz","Immer der dominante Genotyp","Die Zahl der Chromatiden"],"ans":0,"why":"Ein Phänotyp beschreibt eine Merkmalsausprägung, etwa violette Blüten.","level":1,"type":"choice"},{"ch":"grundlagen","q":"Welche Allelkombi
